; TOD Gameplay+ data options. The first level of each option is vanilla.
; Build: python build_gameplay_mod.py --game "<game folder>" --options options.ini --out <work>\todgameplay_data.zip
[gameplay]
; vanilla | better_feel        (steering ramp 0.12, cornering x0.9, slide control x0.5; vehicles research P1)
driving = vanilla
; normal | easy | hard | brutal (normal = vanilla; layered on top of the in-game Easy/Normal/Hard setting)
difficulty = normal
; default | near | far | farther   (player camera -0.5 / +0.75 / +1.5 m along its line of sight)
camera_distance = default
; default | far                  (every vehicle camera 1.5 m further back)
vehicle_camera = default
; default | short | long | very_long   (dive bullet time drain x2 / x0.5 / x0.25)
slowmo_length = default
; default | slow | fast          (slow-motion meter refill x0.5 / x2)
slowmo_regen = default
; vanilla | unlock_all           (experimental: the 26 locked camera sequences of 22 missions become skippable)
cutscenes = vanilla
; off | on | on_start2         (Suave on slot 11: HUD name, icon stand-in, music segments; on_start2 = 2 charges on a new game.
;                              needs suave\audio\build from make_segments.py; the DLL's [suave] enabled = 1 plays it)
suave = off
