; ============================================================================================
;  Gameplay+ HD effects -- settings for d3d9.dll (the TOD HD effects DLL, used as released).
;  Read from the game folder; re-read about once a second while the game runs, so a value can be
;  tuned live.  Lines starting with ; or # are comments.
;
;  What is ON here needs no new art: texture filtering, ambient occlusion, the post pass (grade,
;  sharpen, FXAA), sun shafts and mist, the particle fixes, per-pixel sun lighting from the game's
;  own sky, real-time sun shadows of characters and vehicles, the water shader and the frame cap.
;  Everything that needs the TOD HD texture / model / sky art is OFF at the end of this file and
;  has no effect even if switched on (its data is not installed).
;
;  Gameplay+ owns the window and the resolution ([display] in TODGameplay.ini and the in-game
;  SETTINGS), so borderless, dpi_aware and resolution_lock are 0 here.
;
;  Turn the effects off with the Gameplay+ installer (HD Effects group off): it removes d3d9.dll,
;  this file and tod_hd_fx\.  `enabled = 0` is a pass-through (a test aid).
;  Logs: %LOCALAPPDATA%\TODGameplay\hdfx_logs (set by the Gameplay+ dsound.dll loader; [loader]
;  hdfx_log_dir in TODGameplay.ini changes it; never the game folder).
;  F8 flips the post pass on/off while playing (post_toggle_key).
; ============================================================================================
; ---- master switch
enabled = 1              ; 0 = KILL SWITCH: pure pass-through for everything below.

; ---- frame limiter
fps_cap = 60             ; frames per second (20..1000); 0 = off.
fps_cap_hr_timer = 1     ; 1 = high-resolution timer (Windows 10 1803+), 0 = Sleep(1)

; ---- sharper textures at angles (anisotropic filtering)
aniso_all = 16           ; every 3D draw whose texture the game filters LINEAR gets anisotropic filtering
aniso = 8                ; the ground draws of the parallax below (Track C's setting); the ground uses

; ---- window
borderless = 0           ; Gameplay+ owns this ([display] / SETTINGS): off here
dpi_aware = 0            ; Gameplay+ owns this ([display] / SETTINGS): off here

; ---- quick pack: resolution lock (widescreen that sticks)
resolution_lock = 0      ; Gameplay+ owns this ([display] / SETTINGS): off here

; ---- quick pack: post pass (grade, tone curve, sharpen, FXAA)
post = 1                 ; 0 = off (the game's own picture)
exposure = 0.08          ; EV; compensates the darkening the contrast below would cause on this game's
contrast = 1.06          ; around mid grey, in linear light: deeper shadows, brighter lights (1 = as is)
saturation = 1.04        ; 1 = as is
warmth = 0.0             ; white balance: + warmer (sunlight), - cooler (0 = as is; range -1..1)
tint = 0.0               ; white balance: + magenta, - green (0 = as is)
lift = -0.005            ; black level: negative = deeper blacks, less grey haze (0 = as is)
gamma = 1.0              ; > 1 brightens the mid-tones, < 1 darkens them (1 = as is)
gain = 1.0               ; overall brightness multiplier (1 = as is)
vignette = 0.05          ; corner darkening 0..1 (0 = off)
tonemap = 1              ; 1 = whatever the grade pushes above white rolls off softly instead of clipping
sharpen = 0.30           ; contrast-adaptive sharpening 0..1 (0 = off); never applied on FXAA's edges
fxaa = 1                 ; 1 = anti-aliasing of edges (foliage cut-outs, fences, cables); 0 = off
fxaa_subpix = 0.35       ; how much FXAA also smooths single-pixel detail (0 = none, 1 = soft)
fxaa_edge = 0.125        ; FXAA's edge threshold (0.063 = more edges, 0.333 = only strong ones)
dither = 1               ; +-0.5/255 noise so the grade cannot show banding in skies (0 = off)
post_split = 0           ; A/B side by side: 0.5 = left half the game's own picture, right half graded
post_toggle_key = 0x77   ; key that flips the post pass on/off (0x77 = F8, unbound in TOD's controls; 0 = none)
post_hold_frames = 120   ; now and then the game draws its copy of the scene with a setup the pass cannot

; ---- scene depth: the foundation the three atmosphere effects stand on
depth = 1                ; 1 = on.
depth_log = 0            ; 1 = one log line per depth surface created and bound (diagnostics only)
sky_depth = 0.9995       ; depth at or past which a pixel counts as SKY: never darkened, never tinted,
sky_distance = 0         ; 0 = use sky_depth exactly as it stands (the shipped behaviour).

; ---- ambient occlusion
ssao = 1                 ; 1 = on.
ssao_strength = 0.70     ; 0 = off (either mode), 1 = the tuned amount, 2 = twice as dark
ssao_fade_start = 25     ; metres: full strength nearer than this ...
ssao_fade_end = 60       ; ...
ao_mode = 1              ; 0 = the 12-tap fixed-kernel sampler every release up to 6C4C1857 shipped, using
ao_debug = 0             ; 1 = show the AO buffer alone, instead of the picture (the same view
hbao_directions = 6      ; 2..16 azimuthal directions marched per pixel.
hbao_steps = 5           ; 2..16 samples along each direction.
hbao_radius = 1.20       ; metres: the world radius the horizon is searched over.
hbao_bias = 0.10         ; the SINE of the angle bias (0.10 = 5.7 degrees), not metres.
hbao_intensity = 2.00    ; 0..4, multiplied by the master ssao_strength.
hbao_attenuation = 1.0   ; 0.05..8: the falloff.
hbao_max_radius = 64     ; the cap on the marched screen radius, so a surface at arm's length does not
hbao_blur = 1.0          ; 0..2, the spacing of the depth-aware blur's taps.
ssao_radius = 0.60       ; metres: the world radius the occlusion is gathered over.
ssao_bias = 0.03         ; metres: a surface nearer than this to the tangent plane never occludes itself
ssao_max_radius = 48     ; half-resolution pixels: cap on the tap disc, so a pixel at arm's length does

; ---- sun shafts
light_shafts = 1         ; 1 = on.
shaft_strength = 0.35    ; 0 = off, 1 = three times the shipped amount (this one is easy to overdo)
shaft_decay = 0.965      ; 0.5..0.999 per step: how fast a ray dies away from the sun.
shaft_length = 0.45      ; how far a pixel marches towards the sun, as a share of the screen (0.02..1)
shaft_colour_r = 1.00    ; the light the shafts add, in display colour.
shaft_colour_g = 0.93    ; jungle's own sunlight is yellower than this if you want it dustier
shaft_colour_b = 0.78
sun_dir_x = -0.7171      ; the FALLBACK sun direction (the direction the light travels), used only when
sun_dir_y = -0.6220      ; the level sets no directional light 0.
sun_dir_z = -0.3130

; ---- height mist
mist = 1                 ; 1 = on.
mist_height = -130       ; world y at which the mist is at full density
mist_thickness = 5.0     ; metres over which it thins out above that height (an e-fold)
mist_density = 0.0045    ; extinction per metre at full density.
mist_start = 8           ; metres: nothing nearer than this (so it never fogs the player's own hands)
mist_end = 40            ; ...
mist_colour_r = 0.72     ; the mist's own colour, in display colour.
mist_colour_g = 0.78     ; colour (0.71, 0.80, 0.66)
mist_colour_b = 0.74

; ---- particles
particle_mips = 1        ; 1 = give those draws MIPFILTER = LINEAR.
soft_particles = 1       ; 1 = fade a sprite out where it intersects the geometry behind it, so smoke and
soft_distance = 0.45     ; metres of intersection over which the sprite fades to nothing.

; ---- lit smoke and heat haze
part_lit = 1             ; 1 = light the smoke.
part_lit_strength = 0.65 ; 0..1: how far from the flat sprite towards the fully lit one.
part_lit_round = 0.80    ; 0..1: 0 = a flat card facing you (no split across the puff), 1 = a full sphere
part_lit_wrap = 0.50     ; 0..1: how far the sun wraps past the edge of the puff (smoke scatters light)
heat_haze = 1            ; 1 = on.
heat_haze_strength = 1.0 ; 0..4: how much of a flame's own brightness becomes heat
heat_haze_pixels = 2.5   ; the most the picture is moved, in pixels AT 800 WIDE -- scaled to your width,
heat_haze_distance = 60  ; metres: a fire further away than this does not shimmer at all
heat_haze_scale = 18     ; how many ripples across the screen height (bigger = finer shimmer)
heat_haze_speed = 1.2    ; how fast the ripples rise.
heat_haze_debug = 0      ; 1 = paint the heat mask red over the picture (see where the haze is).

; ---- looking at what the three of them do
atmos_debug = 0          ; 0 = normal.

; ---- per-pixel lighting: the DLL adds the level's own sun per pixel (mode 1)
lighting_mode = 1        ; 0 = OFF: the game's own lighting, byte for byte.
sun_intensity = 0.30     ; the sun's strength.
sun_colour_r = 1.00      ; the sun's colour, per channel.
sun_colour_g = 0.95
sun_colour_b = 0.86
sky_intensity = 0.08     ; x the sky's own irradiance.
sky_colour_r = 1.00      ; x it, per channel
sky_colour_g = 1.00
sky_colour_b = 1.00
ao_influence = 0.60      ; 0..1: how much the SSAO (`ssao` above)
specular = 1.00          ; 0..4: x the material class's own specular (tod_hd_light.txt beside this
shadow_influence = 1.0   ; 0..1: how much of the SHIPPED bake's own darkness gates our sun.
baked_reference = 0.55   ; the DECLARATION path's mean light, which is what "in shadow" is measured
fvf_reference = 0.56     ; the same thing for the FVF LIT path, whose "engine light" is D3DRS_AMBIENT x
neutralise = 1.00        ; mode 2 only, 0..1: how much of the bake's LEVEL survives as an occlusion
colour_keep = 0.35       ; mode 2 only, 0..1: how much of the bake's HUE survives as bounce tint -- the
sky_bake_occ = 1.00      ; MODE 1 only, 0..1 (mode 2 uses `neutralise` for exactly this).
sky_scope = 1            ; 1 = the sky ambient is applied only on a level whose sky the dome's own
light_debug = 0          ; 0 = off.
lighting_verify = 0      ; 1 = on every draw it takes, read the state again and check it against the
lighting_log = 0         ; 1 = one extra log line (a diagnostic)

; ---- the sun's highlight: how narrow and how strong it is allowed to get
light_rough_floor = 0.18 ; 0..0.5: the sun's lobe is never narrower than this roughness (about 1.5
light_spec_max = 0.80    ; 0..64: caps (the specular normalisation x the class's own `specular` column),
light_energy = 1         ; 1 = the diffuse is scaled by (1 - metal), so the conductor rule below MOVES

; ---- per-material roughness and specular (the texture -> material-class map)
light_classes = 1        ; 0 = the map is not even read, not one texture is hashed for it and EVERY draw
light_classes_verify = 0 ; 1 = also SHA-256 every classified texture and check it against the manifest
light_env_stage = 0      ; ONE LIGHT PER TEXTURE (flicker2, KEEP.md 53).

; ---- screen-space reflections
ssr = 1                  ; 0 = the plain shader is bound on every draw: not one march instruction runs.
ssr_intensity = 1.0      ; 0..2, x each class's own `reflect` column in tod_hd_light.txt
ssr_steps = 24           ; 8..64 march steps.
ssr_max_distance = 40    ; metres the ray may travel before it gives up and takes the HDRI instead
ssr_thickness = 0.6      ; metres: how thick a surface in the depth buffer is treated as being.
ssr_fade_edge = 0.12     ; 0..0.5: the share of the screen over which a hit fades out at the border, so
ssr_roughness_cutoff = 0.4 ; a class rougher than this never marches.
ssr_env = 0.0            ; 0..2: the weight of the HDRI ENVIRONMENT where the ray misses.
ssr_debug = 0            ; 0 = off, 1 = the reflection term alone, 2 = green where the ray HIT, red

; ---- emissive lights: fires, lamps and the engine's own point lights light the world
emissive_lights = 0      ; 0 = OFF: the previous release, byte for byte -- not one state is read and not
emissive_intensity = 1.0 ; 0..8, x every source's own colour x intensity (emitters.txt)
emissive_range = 1.0     ; 0.25..4, x every source's own reach.
emissive_count = 4       ; 1..8 lights a frame.
emissive_distance = 60   ; metres: a source whose sphere is further from the eye than this is not
emissive_falloff = 16    ; 0..64: how fast a light dims INSIDE its range -- 1 / (1 + falloff (d/r)^2).
emissive_flicker = 0.35  ; 0..1: how much of a fire's own frame-to-frame brightness reaches its light.
emissive_specular = 1.0  ; 0..4, x each material class's own specular: the lamps' highlights on wet
emissive_occlusion = 0.5 ; 0..1: how much the ambient occlusion dims the emitters' light.
emissive_engine = 1      ; the engine's own point / spot lights, on the objects it lit with them, as it lit
emissive_sprites = 1     ; the fire, explosion, muzzle-flash and lamp-glare sprites are sources
emissive_models = 1      ; the draws of an emissive-class texture are sources (needs light_classes = 1)
emissive_persist = 15    ; 0..120 s: a lamp not drawn for this long fades away
emissive_log = 0         ; 1 = every summary also lists the lights chosen (position, range, colour)
emissive_select = 1      ; WHICH lamps light a thing (lightflicker, KEEP.md 49).

; ---- volumetric beams: real light shafts instead of the painted ones
volumetric_beams = 1     ; 0 = OFF: the painted sprites, byte for byte -- not one draw is refused and
volumetric_intensity = 1.0 ; 0..8: how much light a beam adds.
volumetric_density = 1.0 ; 0..8: how quickly a long look along a beam saturates (looking up a shaft
volumetric_noise = 0.5   ; 0..1: how much drifting dust breaks the shafts up.
volumetric_noise_scale = 0.35 ; dust cells per metre (bigger = finer dust)
volumetric_noise_speed = 0.15 ; metres a second the dust drifts along the beam.
volumetric_steps = 16    ; 4..48 samples marched per half-resolution pixel.
volumetric_coverage = 2.0 ; 0.25..16: how much screen the beams may cover at full steps, in SCREENS
volumetric_anisotropy = 0.35 ; -0.9..0.9: how much brighter a beam is looking INTO the light than
volumetric_cones = 1     ; 1 = the lamp cones too.
volumetric_debug = 0     ; 1 = keep the painted draws AND draw the volume x4 over them (to check that the
volumetric_log = 0       ; 1 = every summary lists each beam (where, how long, how wide, how opaque)
volumetric_light = 1     ; 0 = OFF: the beams exactly as before, byte for byte.
volumetric_light_strength = 2.5 ; 0..8: how much brighter a surface in the middle of a beam gets
volumetric_light_shadows = 1 ; 1 = what stands in the beam casts a shadow; 0 = no shadows (cheaper)
volumetric_light_shadow_distance = 8 ; 1..40 m: how far back up the beam a shadow can come from

; ---- terrain triplanar: no more vertical streaks on steep hillsides
terrain_triplanar = 1    ; 0 = OFF: nothing is created, read or bound -- the previous release, byte
triplanar_slope_start = 0.80 ; the slope where the blend begins, as the surface normal's upward part
triplanar_slope_full = 0.55 ; ...
triplanar_sharpness = 4  ; 1..16: how sharply a face picks the X or the Z projection (higher = narrower
triplanar_scale = 1.0    ; 0.25..4: x every texture's own metres per repeat (bigger = larger texture)
triplanar_macro_detail = 16 ; 2..64: a mountain painting keeps its own colour on a steep face and takes
triplanar_debug = 0      ; 1 = paint the side projections' share red (see exactly where it acts)

; ---- dynamic cast shadows: characters and vehicles cast a real shadow from the sun
dyn_shadows = 1          ; 0 = OFF: the previous release, byte for byte -- the caster hook returns at its
dyn_shadow_strength = 0.85 ; 0..1: how much of the sun a caster takes away (1 = all of it; the sky's
dyn_shadow_base = 0.55   ; 0..1, lighting_mode = 1 only: the share of the BAKED light that is sunlight,
dyn_shadow_range = 30    ; 8..120 m: the map covers this far from its centre, which sits half this far
dyn_shadow_size = 2048   ; 512 / 1024 / 2048 / 4096 texels across (2048 at 30 m = 29 mm a texel;
dyn_shadow_casters = 7   ; which things cast: 1 characters + 2 vehicles + 4 the weapons they hold
dyn_shadow_max_casters = 160 ; caster draws a frame, at most (a busy street is ~60; the rest wait)
dyn_shadow_bias = 0.03   ; metres: keeps a car body from shadowing itself in stripes ("acne").
dyn_shadow_slope_bias = 0.06 ; metres, added where the surface is at a grazing angle to the sun
dyn_shadow_normal_offset = 0.03 ; metres: each point is looked up this far out along its normal
dyn_shadow_softness = 1.0 ; 0.5..4: the width of the shadow's soft edge, in texels of the map
dyn_shadow_debug = 0     ; 1 = paint the dynamic shadows RED, to see what casts and where it lands

; ---- which casters keep their shadow over the cap (KEEP.md 50, popfix)
dyn_shadow_select = 1    ; 0 = OFF: the release before it, byte for byte (the draw order decides).
dyn_shadow_fade_frames = 6 ; 0..30 frames for a shadow to fade in or out (0 = it pops, as before)
dyn_shadow_hysteresis = 0.25 ; 0..2: the head start a caster that already has its shadow keeps (+25 %)
dyn_shadow_edge = 0      ; flicker2 (KEEP.md 53): 0 = as before (the shadow square sits half a range AHEAD of
dyn_shadow_edge_fade = 0.25 ; 0.06..0.5 of the square's half-width

; ---- STATIC SUN SHADOWS: buildings, terrain, rocks, props and foliage cast a real shadow
static_shadows = 0       ; 0 = OFF: the previous release, byte for byte -- every hook returns at its first
static_shadow_strength = 0.85 ; 0..1: how much of the sun the static world takes away (the sky's light
static_shadow_range = 20 ; 5..80 m: about how far the fine cascade reaches from you.
static_shadow_ratio = 4  ; 2..8: how much further (and coarser)
static_shadow_size = 2048 ; 1024 / 2048 / 4096 texels per cascade (3 of them side by side; 2048 = 54 MB
static_shadow_softness = 1.0 ; 0.5..4: the width of the shadow's soft edge, in texels of its cascade
static_shadow_penumbra = 1.0 ; 0..8: contact hardening, x the real sun's size -- sharp where a wall meets
static_shadow_bias = 0.03 ; metres: keeps a surface from shadowing itself in stripes ("acne")
static_shadow_slope_bias = 1.5 ; texels of the cascade, added where the surface is at a grazing angle
static_shadow_normal_offset = 1.0 ; texels: each point is looked up this far out along its normal
static_shadow_blend = 0.2 ; 0.05..0.5: the share of each cascade's reach over which the next one is
static_shadow_budget = 160 ; objects drawn into the maps a frame, at most; the rest are drawn on the
static_shadow_settle = 3 ; 1..60 frames an object must be seen standing still before it casts (a door
static_shadow_casters = 7 ; which draws cast: 1 the terrain + 2 buildings / rocks (the baked path)
static_shadow_min_sun = 0.02 ; a sun dimmer than this (sun_intensity x sun_colour x the sky set's sun)
static_shadow_debug = 0  ; 1 = paint the static shadows BLUE; 2 = the cascades (red near, green, blue far);

; ---- THE WATER: the game's rivers, sea, pools and waterfalls, shaded by the DLL
water_mode = 1           ; 0 = OFF.
water_absorb_r = 0.38    ; extinction per metre, red / green / blue: red goes first, then green,
water_absorb_g = 0.065   ; which is what makes the shallows turquoise and the depths teal-blue.
water_absorb_b = 0.050   ; Raise all three (or water_murk)
water_murk = 1.0         ; 0..8, x all three: 0.5 = a clear pool, 2 = a muddy jungle river
water_colour_r = 0.060   ; the colour deep water scatters back (lit by the level's sun and sky)
water_colour_g = 0.280
water_colour_b = 0.320
water_tex_mix = 0.25     ; 0..1: how much of the game texture's own average colour tints that
water_reflection = 1.0   ; 0..2, x every reflection (the Fresnel itself is physical)
water_env_gain = 1.0     ; 0..4, x the sky / environment a reflected ray falls back to
water_sky = 1.0          ; 0..4, x the sky's light on the water's body
water_wave_size = 14     ; metres: the swell (the chop is ~1/3 of it, the ripples ~1/10)
water_wave_strength = 1.0 ; 0..3: how steep the waves are (0 = a mirror)
water_ripple = 1.0       ; 0..2: the finest ripples
water_swell = 1.0        ; 0..3: the broad swell rolling under the waves on still water (the sea, lakes, pools)
water_wave_speed = 1.0   ; 0..8: how fast still water drifts (a river flows at the engine's own speed)
water_sun = 1.0          ; 0..8: the sun's glitter on the water
water_glint = 1500       ; 50..20000: how sharp each sparkle is (lower = a broader, softer sun path)
water_foam = 1.0         ; 0..2: the foam where the water is shallow (0 = none)
water_foam_distance = 0.5 ; metres of water under which the foam gathers
water_foam_scale = 0.35  ; foam pattern repeats per metre
water_edge = 0.15        ; metres: the water fades in over this depth at a bank (no hard line)
water_refraction = 0.20  ; metres: how far the waves bend what is seen through them ...
water_refraction_pixels = 14 ; ...
water_ssr = 1            ; 1 = the reflection also marches the frame (the banks, trees and rocks appear in
water_ssr_steps = 32     ; 4..48 march steps
water_ssr_distance = 80  ; metres a reflected ray may travel
water_depth_now = 1      ; WHICH DEPTH tells the water how deep it is.
water_fall_speed = 4.0   ; metres a second the waterfall's foam falls
water_fall_foam = 1.0    ; 0..2: how white the waterfall is
water_alpha_ramp = 0.12  ; the game's own alpha over which the water fades in instead of being cut
water_caustics = 0.6     ; 0..4: the dancing light on the shallow bottom (0 = none)
water_shore_darken = 0.35 ; 0..1: the wet, darker shallows right at the water line
water_debug = 0          ; 1 = how deep (black 0 m ..

; ---- keys, testing, logging
reload_frames = 60       ; re-read this file every N frames (0 = only at start)
summary_seconds = 60     ; one summary line in the log this often (fps, limiter holds, draws)
log_every_frame = 0      ; tests only: one log line per frame

; ---- level looks: a look of its own for one level (KEEP.md 41)
sun_pitch = 0            ; degrees added to light 0's elevation, its bearing kept (-30..30; negative =
fog_start_scale = 1.0    ; x the level's fog start (0.25..8): larger = clear air further out
fog_end_scale = 1.0      ; x the level's fog end (0.25..1).
fog_colour_r = 1.0       ; x the level's fog colour (0..2), which is also the colour the sky dome's
fog_colour_g = 1.0       ; horizon fades to
fog_colour_b = 1.0

; ---- lookgrade: warmer ambient, a real tone curve, GTAO (KEEP.md 51)
tonemap_curve = 0        ; 0 = OFF (the grade's shoulder, `tonemap` above), 1 = AgX, 2 = ACES
tonemap_hdr = 1          ; 1 = 16-bit scene targets while the curve is on (applies at the next level load)
tonemap_exposure = 0.0   ; EV before the curve (per level with `<level>.tonemap_exposure`); ACES has its
tonemap_white = 2.94     ; AgX: the light level that reaches white (2.94 = AgX's own; higher = softer highlights)
tonemap_saturation = 1.10 ; AgX: 1 = the plain curve, which fades saturated blues towards white;
tonemap_punch = 1.0      ; AgX: 1 = the base look, 1.35 = Blender's "punchy" (darker, more contrast)
gtao_slices = 3          ; 1..8 directions a pixel
gtao_steps = 6           ; 2..16 steps each way
gtao_radius = 1.20       ; metres
gtao_falloff = 0.615     ; share of the radius over which a sample fades out
gtao_intensity = 1.0     ; the final power: 1 = physical, higher = darker contacts
gtao_albedo = 0.35       ; the multi-bounce fit's typical surface brightness (0 = no multi-bounce)
gtao_influence = 1.0     ; 0..1: how much it dims the ambient (ao_influence's job in modes 0 / 1)
gtao_sky = 0.50          ; 0..1: how much the sky visibility shuts the ambient out indoors
gtao_sky_radius = 6.0    ; metres searched for a ceiling or an overhang
gtao_sky_steps = 3       ; 0..8 (0 = no sky visibility)
gtao_max_radius = 64     ; half-res pixels AT 800 WIDE (scaled to your width): the contact search's cap
gtao_blur = 1.0          ; 0..2: the denoise's tap spacing
gtao_denoise = 2         ; 0..3 rounds of the depth-aware denoise
gtao_upsample = 1        ; 1 = the depth-aware full-resolution upsample; 0 = half resolution, bilinear

