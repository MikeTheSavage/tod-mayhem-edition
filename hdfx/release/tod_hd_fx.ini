; ============================================================================================
;  TOD HD fx -- settings for d3d9.dll (the "kept" TOD HD DLL: ground parallax + frame limiter +
;  sharper textures at angles + borderless window + DPI awareness, and the quick pack: resolution
;  lock, colour grade / sharpen / FXAA, HDRI reflections; and the rebake's sun shadows, off by default;
;  and shine, scene depth with SSAO / sun shafts / height mist / soft particles, the sky dome, and
;  PER-PIXEL LIGHTING -- the DLL lighting the world instead of the engine, `lighting_mode`).
;  Read from the game folder.
;
;  Edit while the game runs: the DLL re-reads this file about once a second (reload_frames) and
;  applies the change on the next frame.  The one exception is dpi_aware: read once, at start.
;  (resolution_lock acts on the game's next resolution request; the start-up size needs a restart.)
;
;  TO TURN THE DLL OFF, run the installer without --fx:
;      python loadcap_test.py --install-normal-no-fx   (a TOD HD research tool, not included)
;  (or install_cli.py without --fx, or Restore the original game in the texture tool).  That
;  removes the DLL AND puts configpc.txt back to fullscreen.
;
;  enabled = 0, or deleting this file, is NOT an off switch.  The DLL then passes everything
;  through, but configpc.txt still runs the game WINDOWED at the desktop size, and TOD's own
;  windowed mode is broken without the DLL: no frame cap (200-2,800 fps; its slow-motion clock
;  freezes above ~360 fps) and the window frame comes back, larger than the screen.  Use the
;  kill switch only to rule the DLL out while testing.  To see the game's own look, set
;  aniso_all = 1 and parallax = 0 instead, and leave fps_cap and borderless on.
;
;  Lines starting with ; or # are comments.  A key left out takes the default shown here.
;  Logs go to a fixed TOD HD dev folder (never the game folder); set TODHD_LOG_DIR to change it.
; ============================================================================================

; ---- master switch ---------------------------------------------------------------------------
enabled = 1            ; 0 = KILL SWITCH: pure pass-through for everything below.  A test aid, not an
                       ; off switch: the game stays windowed and runs uncapped (see the top of this file)

; ---- frame limiter ---------------------------------------------------------------------------
fps_cap = 60           ; frames per second (20..1000); 0 = off.  The game's own loop never waits and
                       ; runs at 200-2,800 fps here; above ~360 fps its slow-motion script clock
                       ; freezes, so the cap is also a gameplay fix.  60 matches a 59/60 Hz display.
fps_cap_hr_timer = 1   ; 1 = high-resolution timer (Windows 10 1803+), 0 = Sleep(1) + spin (uses more CPU).
                       ; Live, like the others

; ---- sharper textures at angles (anisotropic filtering) -------------------------------------
aniso_all = 16         ; every 3D draw whose texture the game filters LINEAR gets anisotropic filtering
                       ; at this level (2..16, capped at what the GPU supports); 1 = off (the game's
                       ; own filtering).  Pre-transformed 2D draws (screen-space vertices) are never
                       ; touched.  HUD/menu layers the game draws in 3D may get it too; on flat,
                       ; screen-facing quads that looks the same.
aniso = 8              ; the ground draws of the parallax below (Track C's setting); the ground uses
                       ; the higher of aniso and aniso_all.  1 = off.

; ---- window ----------------------------------------------------------------------------------
borderless = 1         ; only when the game runs WINDOWED (configpc.txt): no title bar or frame, and
                       ; the window covers the monitor it is on (set the game's screen size to the
                       ; monitor's resolution for a full-screen look; a smaller size sits centred).
                       ; The installer sets that size once (--screensize desktop): after changing the
                       ; display resolution, run the installer again.  Exclusive fullscreen is left
                       ; alone.  0 = the game's normal window.
dpi_aware = 1          ; 1 = tell Windows the game handles DPI itself, so at 150% scaling a 3024x1964
                       ; window really is 3024x1964 pixels (no blurry upscale).  Read once at start.
                       ; If Windows already makes TOD.exe DPI-aware (Properties > Compatibility >
                       ; Override high DPI scaling: Application, as on this PC), that wins and this
                       ; key changes nothing; the log says "already DPI-aware".

; ---- quick pack: resolution lock (widescreen that sticks) -----------------------------------
resolution_lock = 1    ; windowed game only: it keeps the size it runs at (configpc.txt screensize,
                       ; the desktop size after an install) for the whole session.  Without it the
                       ; game switches to the resolution saved in its options profile about 10 s
                       ; after start (1600x1200 here: a 4:3 window in the middle of the screen).
                       ; Choosing a resolution in the options menu is then ignored (logged); change
                       ; screensize in configpc.txt instead.  Also gives the start-up back buffer the
                       ; exact size (no 30 px lost to the clipped title bar).  0 = the game's own
                       ; behaviour.

; ---- quick pack: post pass (grade, tone curve, sharpen, FXAA) -------------------------------
; Runs on the game's own copy of the 3D scene to the screen, BEFORE the HUD is drawn: HUD and menus
; keep their colours.  All keys are live.  post_toggle_key flips the whole pass for an A/B look.
post = 1               ; 0 = off (the game's own picture)
exposure = 0.18        ; EV; compensates the darkening the contrast below would cause on this game's
                       ; mostly mid-dark scenes (tuned: the average brightness stays within 3%)
contrast = 1.10        ; around mid grey, in linear light: deeper shadows, brighter lights (1 = as is)
saturation = 1.08      ; 1 = as is
warmth = 0.12          ; white balance: + warmer (sunlight), - cooler (0 = as is; range -1..1)
tint = 0.0             ; white balance: + magenta, - green (0 = as is)
lift = -0.010          ; black level: negative = deeper blacks, less grey haze (0 = as is)
gamma = 1.0            ; > 1 brightens the mid-tones, < 1 darkens them (1 = as is)
gain = 1.0             ; overall brightness multiplier (1 = as is)
vignette = 0.08        ; corner darkening 0..1 (0 = off)
tonemap = 1            ; 1 = whatever the grade pushes above white rolls off softly instead of clipping
sharpen = 0.30         ; contrast-adaptive sharpening 0..1 (0 = off); never applied on FXAA's edges
fxaa = 1               ; 1 = anti-aliasing of edges (foliage cut-outs, fences, cables); 0 = off
fxaa_subpix = 0.35     ; how much FXAA also smooths single-pixel detail (0 = none, 1 = soft)
fxaa_edge = 0.125      ; FXAA's edge threshold (0.063 = more edges, 0.333 = only strong ones)
dither = 1             ; +-0.5/255 noise so the grade cannot show banding in skies (0 = off)
post_split = 0         ; A/B side by side: 0.5 = left half the game's own picture, right half graded
post_toggle_key = 0x77 ; key that flips the post pass on/off (0x77 = F8, unbound in TOD's controls; 0 = none)
post_hold_frames = 120 ; now and then the game draws its copy of the scene with a setup the pass cannot
                       ; reproduce, and that frame shows the game's own picture.  So that the grade
                       ; never flickers on single frames it then stays off until this many copies in
                       ; a row were fine (120 = 2 s at 60 fps; doubled while it keeps happening, at
                       ; most 3600 = 1 min).  The log's summary++ line says how often and why.
                       ; 0 = no hold (the grade comes back on the next good frame)

; ---- quick pack: HDRI reflections ---------------------------------------------------------------
env = 1                ; the game's reflection maps on weapons, vehicles, glass and metal are replaced by
                       ; maps made from an HDRI (tod_hd_fx\env\, see SOURCES.txt there), in the
                       ; engine's own projection.  Location-specific maps (DEA basement, pool) stay.
                       ; 0 = the game's own maps.  New HDRI: tools\make_envmaps.py (one command)
env_strength = 0.75    ; scales the game's reflection strength on those surfaces (0..2; 1 = as the game
                       ; sets it; weapons are already at the game's maximum, so above 1 only helps cars)

; ---- shine: per-material reflections on props the engine gives no reflection map --------------
; The engine only reflects on meshes whose own flags opt in (weapons, car bodies, glass), which is why a
; pressure tank, a steel crate or the barrel read as flat paint however good the texture is.  `shine`
; gives CHOSEN materials a reflection of the same HDRI, drawn as ONE extra additive pass over the game's
; own draw -- the game's draw itself is never changed, so shine = 0 is exactly the picture without it.
; WHICH materials, and how each one looks (strength, tint, gloss = which HDRI blur level, fresnel), is
; in tod_hd_shine.txt beside this file.  EDIT THAT FILE to tune a single prop; it is re-read live too.
; The keys below are the global knobs, for a quick A/B while the game runs.
shine = 1              ; 1 = on.  0 = no extra pass at all (the picture of the previous release)
shine_strength = 1.0   ; multiplies every material's own strength (0..2).  0 = off, 0.5 = half, 1.5 = more
shine_fresnel = 1.0    ; multiplies every material's own fresnel amount (0..1).  0 = the reflection is as
                       ; strong head-on as at grazing angles; 1 = as tod_hd_shine.txt asks

; ---- sun shadows (the lighting rebake's crisp shadows, MM010 jungle) -------------------------
; Crisp sun shadows (trees, buildings) on the ground of the MM010 camp / zipline area, from the lighting
; rebake's shadow maps (tod_hd_fx\shadow\, contract r2).  The term is ADDITIVE and averages to zero:
; it moves light around inside a shadow's neighbourhood, it never darkens the ground on average.
; It only draws on the rebaked ground: the stage-0 texture must be one of shadow\receivers.txt AND the
; colours one of the 49 rebaked buffers (hashed when the game loads them).  So it needs the rebaked
; colours in the game (install with TODHD_REBAKE=1); with the shipped colours nothing matches and the
; picture does not change.  Outside the shadow map nothing ever changes.  All keys are live.
; The contract's names sunshadow / sunshadow_strength / sunshadow_max_darken are read too.
sun_shadows = 0        ; 1 = on.  Off until the look is approved in the game.  0 = the previous release
sun_shadow_strength = 0.5  ; how strong the crisp shadows are (0..0.75; values above 0.75 are cut to
                       ; 0.75: at 1.0 the rebake's checker saw block and forest-floor shadows go black)
sun_shadow_max_darken = 0.35  ; the term may lower a colour by at most this share of it (0..0.6;
                       ; 0 = it can only brighten)

; ---- scene depth: the foundation the three atmosphere effects stand on -----------------------
; Direct3D 9 cannot read a depth-stencil surface, so the proxy hands the game a readable depth TEXTURE
; instead (INTZ on NVIDIA and Intel, DF24 or RAWZ on older ATI parts).  Same size, same sample type,
; same stencil, same reference count -- the game renders into it exactly as before, and we can read it.
; It is the only D3DPOOL_DEFAULT resource this DLL owns: it is released before every Reset (Alt+Tab, a
; resolution change) and made again when the game creates its next depth surface.  If the adapter has
; no readable depth format, the log says so and everything below quietly does nothing.
depth = 1              ; 1 = on.  0 = the game gets exactly the depth surface it asked for, and ssao,
                       ; light_shafts, mist and soft_particles can do nothing (the previous release)
depth_log = 0          ; 1 = one log line per depth surface created and bound (diagnostics only)
sky_depth = 0.9995     ; depth at or past which a pixel counts as SKY: never darkened, never tinted,
                       ; and always an opening for a sun shaft.  This is a DEVICE z, so what it means in
                       ; metres is the LEVEL'S OWN projection: with MM010's (near 0.125, far 1000.9)
                       ; 0.9995 is exactly 200 m, which is why a hill, a water tower or a building more
                       ; than 200 m away does not block a shaft -- the rays shine through its silhouette.
                       ; RAISE it towards 1 to make distant geometry block shafts; LOWER it to let more of
                       ; the horizon act as sky.  Lower it too if a level's skybox writes depth and gets
                       ; occlusion.  `summary atmos:` prints the threshold in use AND what it is in metres.
sky_distance = 0       ; 0 = use sky_depth exactly as it stands (the shipped behaviour).  Set it in METRES
                       ; instead and the DLL converts, per level, from that level's own projection -- so
                       ; "sky_distance = 600" means the same thing on every map, while sky_depth does not

; ---- ambient occlusion -----------------------------------------------------------------------
; Contact darkening where surfaces meet: under crates, in doorways, where a tree trunk meets the ground.
; A half-resolution pass over the scene depth, blurred with a depth-aware filter so it cannot bleed
; across a silhouette, and composited into the game's own scene -> back-buffer copy BEFORE the grade --
; which is before the HUD is drawn, so it can never touch the HUD.  All keys are live.
;
; This matters more than it sounds with lighting_mode = 2, where the engine's baked lighting is
; normalised away and OUR sky term lights everything: the occlusion is then the main thing grounding an
; object in the world, and it is what ao_influence (below, in the lighting section) feeds.
;
; `ssao` and `ssao_strength` are the MASTER switch and the MASTER strength in BOTH modes, and
; ssao_fade_start / ssao_fade_end are the view-distance falloff in both.  Everything else in this block
; belongs to one mode or the other.
ssao = 1               ; 1 = on.  0 = the copy is drawn by the very shader the previous release shipped
ssao_strength = 0.70   ; 0 = off (either mode), 1 = the tuned amount, 2 = twice as dark
ssao_fade_start = 25   ; metres: full strength nearer than this ...
ssao_fade_end = 60     ; ... and none beyond this (distant geometry has no depth detail to measure)

ao_mode = 1            ; 0 = the 12-tap fixed-kernel sampler every release up to 6C4C1857 shipped, using
                       ;     the ssao_radius / ssao_bias / ssao_max_radius keys below.  The frame is then
                       ;     BYTE-IDENTICAL to that release: the DLL binds that release's own gather
                       ;     shader, not a branch inside a new one, and the build gates it by finding
                       ;     those bytes inside the shipped DLL.
                       ; 1 = HBAO, horizon-based ambient occlusion (the default).  Instead of counting
                       ;     how many points of a fixed kernel happen to lie in front of the tangent
                       ;     plane, it MARCHES the depth buffer outwards in hbao_directions directions
                       ;     and finds, per direction, the highest thing the surface can see -- the
                       ;     horizon.  The occlusion is the sine of that horizon's elevation, so a
                       ;     crease, a doorway corner or the line where a crate meets the ground darkens
                       ;     by the angle the geometry actually subtends.
                       ; 2 = GTAO (lookgrade): see `gtao_*` at the end of this file.
                       ; This is an A/B worth looking at: flip it while the game runs (the ini is
                       ; re-read live) and watch WHERE the darkness sits, not how much of it there is.
                       ; On the gate's own scene -- boxes standing on a floor -- the deepest 24x24 block
                       ; of the occlusion buffer goes 226.59 -> 209.80 of 255 while open flat ground
                       ; pays 0.02 for it.  On MM010's terrain, which has no object standing on a floor
                       ; in it, the 12-tap sampler is actually the DARKER of the two: it sums twelve taps
                       ; and saturates wherever the ground is cluttered, while a horizon integral weights
                       ; what it finds by how far away it is.  So the question in game is "has the
                       ; darkness moved onto the contact", never "is it darker".
                       ; Cost: about a tenth of a millisecond of a 16.7 ms frame at 3024x1964, which is
                       ; no more than the 12-tap sampler it replaces (two whole runs of the cost gate
                       ; measured +0.089 and -0.077 ms against it: they bracket zero).
ao_debug = 0           ; 1 = show the AO buffer alone, instead of the picture (the same view
                       ; atmos_debug = 1 gives, under a name that belongs to the AO).  atmos_debug wins
                       ; if both are set.  It will look nearly white: the whole effect lives in the last
                       ; few units of 255 and that is what a correct AO buffer looks like on open ground

; HBAO's own keys (ao_mode = 1 only; with ao_mode = 0 not one of them is even uploaded to the shader)
hbao_directions = 6    ; 2..16 azimuthal directions marched per pixel.  A SMOOTHNESS knob, not an amount
                       ; knob: it changes which pixels are occluded and by how much far more than how
                       ; many.  4 is visibly noisier, 8 is a little cleaner
hbao_steps = 5         ; 2..16 samples along each direction.  THE quality knob: 6 x 5 = 30 marched
                       ; samples ships.  The gate's contact reads 231.12 of 255 at 2 steps, 209.80 at
                       ; the shipped 5 and 191.14 at 10, for roughly twice the arithmetic.  Raising it
                       ; also makes the search FINER, which is the one direction that can bring back a
                       ; reconstruction band on flat ground -- see hbao_max_radius
hbao_radius = 1.20     ; metres: the world radius the horizon is searched over.  Larger than the 12-tap
                       ; sampler's 0.60 m because a far sample can only LOWER the weight here, never
                       ; invent a horizon.  Raise it WITH hbao_steps: a wider search at the same step
                       ; count simply steps over the contact (0.30 m leaves it at 242.48, while 2.00 m
                       ; with hbao_steps = 8 takes it to 179.51)
hbao_bias = 0.10       ; the SINE of the angle bias (0.10 = 5.7 degrees), not metres.  A horizon lower
                       ; than this never occludes.  It is what kills self-occlusion on flat ground seen
                       ; at a grazing angle -- the one place a horizon search invents darkness that is
                       ; not there.  0.45 leaves the contact at 236.88.  If flat ground ever reads DIRTY
                       ; -- a general grey haze -- raise this first.  If instead you see one straight
                       ; horizontal LINE across the picture at a fixed distance, that is a different
                       ; fault and this key is not the cure: report it, it is gated at ten cameras and
                       ; two resolutions and it should not come back
hbao_intensity = 2.00  ; 0..4, multiplied by the master ssao_strength.  2.00 x 0.70 = 1.40 is EXACTLY
                       ; the multiplier the 12-tap sampler applies to its own count, so the two modes
                       ; are scaled identically and the A/B is a comparison of shapes, not of amounts
hbao_attenuation = 1.0 ; 0.05..8: the falloff.  A sample's weight is 1 - (distance / hbao_radius)^2 x
                       ; this, so at 1.0 it reaches zero exactly at the radius.  Higher = only very
                       ; near geometry occludes; this is what stops a wall ten metres behind a railing
                       ; darkening the railing
hbao_max_radius = 64   ; the cap on the marched screen radius, so a surface at arm's length does not
                       ; march the whole screen.  Counted in half-resolution texels AT A 800-PX-WIDE
                       ; REFERENCE and scaled to the resolution you actually run: at 800x600 the shipped
                       ; 64 is 64 texels, at 3024x1964 it is 242, so one number means the same share of
                       ; the picture everywhere.  (It did not always: before this was scaled, the cap bit
                       ; 3.78x sooner at 3024x1964 than in any test picture, and most of hbao_radius
                       ; stopped operating in the near field.)  Mostly a cost bound.  Setting it very low
                       ; does not remove the occlusion, it makes the search tight and high-frequency
                       ; (4 leaves the gate's contact at 236.80) -- and a tight search is the one thing
                       ; that can bring back a band on flat ground.  summary ao: prints both numbers
hbao_blur = 1.0        ; 0..2, the spacing of the depth-aware blur's taps.  0 = no blur at all (you can
                       ; then see the per-pixel rotation as fine directional noise -- that is what the
                       ; blur is for).  1.0 is the spacing the seven-tap kernel was designed for.
                       ; Neighbouring pixels of the AO buffer disagree by 0.154 of 255 at 0, 0.039 at the
                       ; shipped 1.0 and 0.049 at 2 -- widening it spreads the same seven taps over four
                       ; times the footprint and buys nothing

; the 12-tap sampler's own keys (ao_mode = 0 only)
ssao_radius = 0.60     ; metres: the world radius the occlusion is gathered over.  About a crate edge or
                       ; a doorway corner at this game's scale.  Larger = broader, softer shading
ssao_bias = 0.03       ; metres: a surface nearer than this to the tangent plane never occludes itself
ssao_max_radius = 48   ; half-resolution pixels: cap on the tap disc, so a pixel at arm's length does
                       ; not gather half the screen (that would be slow and would read unrelated things)

; ---- sun shafts ------------------------------------------------------------------------------
; Rays from the sun, occluded by whatever stands in front of it: a screen-space march from each pixel
; towards the sun's projected position, counting how much of the way saw sky.  The sun direction is read
; from the LEVEL's own light 0 every frame, so it is right in every level; sun_dir is only the fallback
; for a level that never sets one (its default is MM010's light 0).  The shafts fade out continuously as
; the sun leaves the screen or swings behind the camera, so they can never flicker.  All keys are live.
light_shafts = 1       ; 1 = on.  0 = off
shaft_strength = 0.35  ; 0 = off, 1 = three times the shipped amount (this one is easy to overdo)
shaft_decay = 0.965    ; 0.5..0.999 per step: how fast a ray dies away from the sun.  Lower = shorter
shaft_length = 0.45    ; how far a pixel marches towards the sun, as a share of the screen (0.02..1)
shaft_colour_r = 1.00  ; the light the shafts add, in display colour.  Warm white by default; the
shaft_colour_g = 0.93  ; jungle's own sunlight is yellower than this if you want it dustier
shaft_colour_b = 0.78
sun_dir_x = -0.7171    ; the FALLBACK sun direction (the direction the light travels), used only when
sun_dir_y = -0.6220    ; the level sets no directional light 0.  This is MM010's light 0.
sun_dir_z = -0.3130

; ---- height mist -----------------------------------------------------------------------------
; Fog that POOLS: its density falls off exponentially with world height, and it is integrated along the
; view ray, so valleys and the jungle floor fill with it while a hilltop stays clear.  It is layered
; UNDER the game's own linear fog (where the engine's fog already owns the pixel, the mist adds almost
; nothing), and it never touches the sky or the HUD.  All keys are live.
;
; mist_height is an ABSOLUTE world height, so it is PER LEVEL.  The default is MM010's jungle floor (the
; drawn geometry of submap01_map09_jungle sits between y = -142 and -118, the ground parts around -129).
; To retune it for another level: read the `summary atmos:` line in todhd_fx.log -- it prints the eye's
; own world y -- and put mist_height a few metres below the ground you are standing on.
mist = 1               ; 1 = on.  0 = off
mist_height = -130     ; world y at which the mist is at full density
mist_thickness = 5.0   ; metres over which it thins out above that height (an e-fold)
mist_density = 0.0045  ; extinction per metre at full density.  0 = off; 0.02 is a thick soup
mist_start = 8         ; metres: nothing nearer than this (so it never fogs the player's own hands) ...
mist_end = 40          ; ... and the full effect from here on
mist_colour_r = 0.72   ; the mist's own colour, in display colour.  The default is the level's own fog
mist_colour_g = 0.78   ; colour (0.71, 0.80, 0.66) warmed very slightly
mist_colour_b = 0.74

; ---- particles -------------------------------------------------------------------------------
; Two fixes from the effect research (work\research\vfx\VFX.md).  A sprite draw is recognised by the
; level-0 SHA-256 of its texture (tod_hd_fx\particles\manifest.txt: every texture the project's material
; classification calls a particle or an fx_decal) AND by the render state of the draw itself.  Both keys
; are live, and the summary line says how many draws each one took and why the others were left alone.
particle_mips = 1      ; 1 = give those draws MIPFILTER = LINEAR.  The engine sets NONE on 3,439 of 3,502
                       ; particle draws although the sprites ship with full mip chains, which is why
                       ; smoke and dust crawl at a distance.  0 = the engine's own NONE
soft_particles = 1     ; 1 = fade a sprite out where it intersects the geometry behind it, so smoke and
                       ; fire stop cutting a hard line into the ground.  This is the one thing in this
                       ; DLL that DRAWS the game's sprite itself instead of adding a pass over it, so
                       ; anything it cannot reproduce exactly is refused by name in the log.  0 = off
soft_distance = 0.45   ; metres of intersection over which the sprite fades to nothing.  0 = no fade

; ---- lit smoke and heat haze -------------------------------------------------------------------
; Both ride on the soft-particle pass above (the same sprite recognition, the same refusals by name) and
; both ship OFF.  Every key is live.  KEEP.md section 22 has the whole design and what was measured.
;
; WHICH SPRITES: tod_hd_fx\particles\kinds.txt names them, one manifest key a line (`smoke smoke`,
; `fire heat`), built from the game's real sprite list.  Add a key there to light it or make it hot; it is
; read when the game starts.  (Until 2026-09-22 evening both features took NO real sprite at all: every
; effect draw the game makes uses range fog, which the soft pass could not reproduce.  KEEP.md 22.7.)
;
; LIT SMOKE.  The engine draws every particle self-lit, so a smoke column is one flat colour on its sunny
; and its shady side and reads as a decal.  With part_lit = 1, ALPHA-BLENDED sprites whose key is a
; `smoke` line of kinds.txt (smoke, dust, mist, fog, puffs, exhaust) take the per-pixel lighting's OWN sun and sky --
; the same light 0 direction, sun_colour x sun_intensity, and HDRI sky ambient the world gets -- shaded
; as a round puff facing you.  The light is normalised so a puff keeps the engine's AVERAGE brightness:
; what changes is the split between the side facing the sun and the side away from it.
;   * ADDITIVE sprites (fire, explosions, sparks, glows) are NEVER lit: lighting them could only darken
;     them.  Butterflies, leaves and blood are not smoke and stay as the engine draws them.
;   * BLACK smoke stays black: the dark plume over fires and explosions is the `smoke` sprite, whose
;     texture is black, so light (which scales the sprite's own colour) has nothing to show on it and
;     kinds.txt leaves it out.  The lit ones are smoke_white (the air vents, grey / brown / white smoke,
;     dust clouds, exhaust) and the dust / mist / puff sprites.
;   * It needs lighting_mode = 1 or 2.  With lighting_mode = 0 the engine lights the world, there is no
;     sun or sky of ours to hand the smoke, and part_lit does nothing (the log says so).
;   * Where to look: the camp's air vents (Smoke_AirVent), a burning barrel or a wreck after an explosion,
;     with the sun to one side of you.  `summary partfx:` in the log counts what was lit and what was not.
part_lit = 0               ; 1 = light the smoke.  0 = the engine's flat sprite, exactly
part_lit_strength = 0.65   ; 0..1: how far from the flat sprite towards the fully lit one.  1 = the
                           ; strongest sun / shadow split; 0.65 keeps the shadow side about 60 % of the
                           ; engine's brightness and the sunny side about 140 % with the shipped light
part_lit_round = 0.80      ; 0..1: 0 = a flat card facing you (no split across the puff), 1 = a full sphere
part_lit_wrap = 0.50       ; 0..1: how far the sun wraps past the edge of the puff (smoke scatters light)
;
; HEAT HAZE.  The air above fires and explosions shimmers: the picture behind the ADDITIVE fire and
; explosion sprites is bent by a rising, procedural ripple, at the game's own final copy of the frame (the
; current frame -- nothing lags, and no second copy of the frame is taken).  Each flame writes how much
; heat it carries into a mask while the game draws it, with the game's own depth test, so a wall or a
; person standing IN FRONT of the fire is never bent.  Costs one full-screen A8R8G8B8 texture (23 MB at
; 3024x1964).  Where to look: a burning barrel or a vehicle on fire, with something straight behind it.
heat_haze = 0              ; 1 = on.  0 = off, exactly
heat_haze_strength = 1.0   ; 0..4: how much of a flame's own brightness becomes heat
heat_haze_pixels = 2.5     ; the most the picture is moved, in pixels AT 800 WIDE -- scaled to your width,
                           ; so 2.5 is about 9.5 px at 3024x1964.  Raise for a stronger wobble
heat_haze_distance = 60    ; metres: a fire further away than this does not shimmer at all
heat_haze_scale = 18       ; how many ripples across the screen height (bigger = finer shimmer)
heat_haze_speed = 1.2      ; how fast the ripples rise.  0 = frozen
heat_haze_debug = 0        ; 1 = paint the heat mask red over the picture (see where the haze is).  Never leave it on

; ---- flipbook sprites ---------------------------------------------------------------------------
; The engine has no flipbook: every particle sprite is one still picture for its whole life.  With
; part_flipbook = 1 a sprite that has a row in tod_hd_fx\flipbook\manifest.txt is drawn from an
; ANIMATED SHEET instead -- the `fire` sprite plays a 64-frame fire rendered from a real fire simulation
; (8x8 cells of 256 px) -- and EVERY PARTICLE PLAYS IT FROM ITS OWN PHASE.  The DLL follows each particle
; from frame to frame by the order the engine draws them in (oldest first, newborns at the end), so a
; particle keeps its own birth and its own starting frame for its whole life; nothing is on a global
; clock, so a fire's flames never flicker in step.  Rides on the soft-particle pass above (same sprite
; recognition, same refusals); with lit smoke and heat haze on, the animated texel is lit / makes heat.
;   * The sheet is turned UPRIGHT: the engine spins every fire particle to a random angle, and a flame
;     has to burn upwards, so the sheet is turned to world up (with a small wobble and a mirror per
;     particle so no two look alike).  part_flipbook_upright = 0 keeps the engine's spin instead.
;   * The animation runs on the game's simulation, not the wall clock: pause the game and it freezes.
;   * The sheet is the DLL's own texture (2.8 MB); it never replaces `fire` for anything but these draws.
;   * Where to look: any burning barrel, wreck or the camp's fires.  `summary flipbook:` in the log counts
;     the particles followed (kept), newly born, and re-seeded (lost and found again -- should stay small).
part_flipbook = 0              ; 1 = on.  0 = the engine's still sprites, exactly
part_flipbook_fps_scale = 1.0  ; 0.25..4 x each sheet's own speed (the fire plays 30 frames a second)
part_flipbook_blend = 1        ; 1 = each frame blends into the next (smooth); 0 = hold each frame
part_flipbook_upright = 1      ; 1 = flames burn upwards; 0 = keep the engine's random spin for every sheet

; ---- one-shot flipbook sheets: explosions ---------------------------------------------------------
; The explosion fireballs (explosion01, explosion03, explosion04: every grenade, barrel, tank and car
; blast) play a 64-frame fireball rendered from a real explosion simulation (JangaFX Gasoline_Explosion,
; CC0) -- ONCE, from each particle's own birth, and then hold the sheet's last frame, which is empty, so
; an explosion never restarts or freezes on screen.  Needs part_flipbook = 1 too.
;   * A fireball particle lives 0.3-0.4 s, so the sheet plays its whole 64 frames in that time.
;     part_flipbook_fps_scale slows it (0.5 = you see the first half: the bright bloom).
;   * The same sprite is also the bullet-impact spark (a few centimetres across): anything under 1 m
;     when it appears keeps the game's own sprite, so sparks are untouched.
;   * An explosion already under way when it comes into view starts part-way through the sheet (read
;     off how far it has faded), not from the beginning.
;   * The explosion's SMOKE plays a churning smoke puff (JangaFX Smoke_Plume) and its white puffs a dust
;     burst (JangaFX GrenadeDustImpact).  Chimneys, campfires and mist use the same sprites, so only smoke
;     born within 0.6 s and 25 m of a fireball plays them; every other puff stays exactly the game's.
;   * The sheets (14 MB together) are loaded the first time an explosion is on screen with this on.
;   * Where to look: throw a grenade, shoot a red barrel.  `summary flipbook:` counts the one-shot draws,
;     the sparks left alone (under minsize), the ones first seen mid-life, the smoke with no fireball
;     near (left alone) and the fireballs seen.
part_flipbook_once = 0         ; 1 = on.  0 = explosions exactly as before (and part_flipbook = 1 animates
                               ; the fire alone)

; ---- epic explosions --------------------------------------------------------------------------------
; On top of the one-shot sheets above (they need part_flipbook = 1 and part_flipbook_once = 1).  Every key here at
; the value written below is the release before it (batch 3) exactly.  Recommended for "epic":
;   explosion_scale = 1.4, explosion_smoke_scale = 1.25, explosion_haze = 2, explosion_fx = 1, and with the
;   GRENADE's engine patches (batch 4) explosion_long_life = 2 (explosion_life stays 1)
; and, through the installer, the ENGINE patches that make the explosions themselves bigger and longer-lived
; (work\vdb_test\explosion2\analysis\explosion_patches.json): explosion_life = 2 is what matches them.
;   * explosion_scale: the fireball quads bigger, growing upwards from where they stand.
;   * explosion_smoke_scale: the explosion's smoke and dust puffs bigger (chimneys and campfires never).
;   * explosion_life: the sheets played that many times slower -- to span the doubled lives of the engine patches.
;   * explosion_haze: the heat shimmer an explosion makes, that many times stronger (heat_haze = 1).
;   * explosion_fx: the DLL draws, for every explosion, a bright flash, hot embers thrown out and falling, and a dust
;     shockwave ring painted on the ground around it (it needs depth = 1; without it, no ring).
explosion_scale = 1.0          ; 1 = as the game sizes them.  0.25..4
explosion_smoke_scale = 1.0    ; 1 = as the game sizes them.  0.25..4
explosion_life = 1.0           ; 1 = the sheets at their own speed.  0.25..4 (2 with the engine patches on every explosion)
explosion_long_life = 1.0      ; the same, only for the fireballs a row marks longlife= (the grenade's).  0.25..4
explosion_haze = 1.0           ; 1 = the heat as it was.  0..8
explosion_fx = 0               ; 1 = the flash, the embers and the ground ring.  0 = none of them
explosion_flash = 1.0          ; the flash's strength (0 = no flash).  0..4
explosion_embers = 64          ; embers thrown out by each explosion.  0..256
explosion_ring = 1.0           ; the ground ring's strength (0 = no ring).  0..4
explosion_ring_radius = 2.0    ; the ring's reach, in fireball sizes (a grenade's fireball is 3-4.5 m).  0.5..10
explosion_ring_seconds = 1.8   ; how long the ring spreads before it has settled.  0.3..8

; ---- looking at what the three of them do ----------------------------------------------------
atmos_debug = 0        ; 0 = normal.  1 = the ambient occlusion on its own, 2 = the sun shafts, 3 = the mist,
                       ; 4 = the scene depth itself (white = 200 m).  Never leave it on

; ---- THE SKY: one HDRI dome instead of the engine's five skybox faces ------------------------
; MM010 draws its sky as FIVE 256x256 cube faces (there is no DOWN face) as the first five draws of
; every frame.  At 3024x1964 that is 2.84 texels per degree magnified about fourteen times, which is
; the softness and the banding you see, and the four vertical seams sit at azimuth +-45 and +-135.
; With sky_dome = 1 the DLL recognises those five draws -- by the SHA-256 of the texture the game
; uploads (tod_hd_fx\sky\manifest.txt, which the installer rebuilds from the archive it packs) AND
; by their render state -- skips them, and draws ONE full-screen quad in their place, sampling the
; equirectangular panorama tod_hd_fx\sky\sky.dds (4096x2048, 11.38 texels per degree, a full mip
; chain, 43 MB).  There is no cube and therefore no seam, the whole picture is covered (the engine's
; open box is not), and the depth behaviour is the engine's own: no test, no write, behind everything.
; If anything at all is missing -- the panorama, shader model 3, a plain perspective projection --
; the DLL refuses and the game draws its own five faces, exactly as before.
; The dome is drawn at the FIRST face of each RUN of recognised face draws, not once a frame: if the
; engine ever drew a second skybox pass in one frame (a mirror, a reflection target, a cutscene
; compositing two views) a once-a-frame rule would skip its faces and draw nothing there.  In MM010
; the five faces are the first five draws of the frame, so this is one dome a frame exactly as before
; and `summary sky:` says how many runs it saw.
sky_dome = 1           ; 0 = the game's own five skybox faces, byte for byte
sky_yaw = 28.27        ; degrees the panorama is turned about the up axis.  The HDRI's own sun sits at
                       ; longitude 38.14 and MM010's light 0 puts the sun at azimuth +66.41, so 28.27
                       ; is what makes the sky's bright quarter agree with the level's own shadows.
                       ; It turns the view RAY, not the texels, so it is live and costs nothing
sky_pitch = 0          ; degrees the panorama is LIFTED in the sun's own vertical plane.  The HDRI is a
                       ; sunrise: its sun is about 31 degrees LOWER than this level's (+38.46), and no
                       ; yaw can fix that.  Two ways out, and they can be mixed:
                       ;   * leave this at 0 and let sun_disc below draw the sun where the level says
                       ;     it is (recommended: nothing else in the picture moves);
                       ;   * set it to about 31 to lift the whole panorama's sun to the level's own
                       ;     elevation -- which also drags the HDRI's ground half up over the horizon
                       ;     on one side and tilts its cloud bands.  Try 10-15 first
sky_exposure = 1.0     ; a multiplier in linear light (1 = the panorama as it was baked)
sky_tint_r = 1.0       ; per-channel, multiplied into the exposure.  1,1,1 = no tint
sky_tint_g = 1.0
sky_tint_b = 1.0

; ---- the sun itself --------------------------------------------------------------------------
; Drawn at the LEVEL's own directional light 0, read off the device every frame -- the same bearing
; the sun shafts use and the same one the shadows come from.  So it is in the right place even when
; the HDRI's own sun is not (see sky_pitch).
; BE AWARE: the disc and its glow are ADDED OVER the panorama, with no regard for what the panorama
; already has in that direction.  The HDRI's own sun sits about 33 degrees lower than this level's,
; so the disc can land on a CLOUD and will then read as a sprite pasted on top of it rather than as
; a sun.  If it does: raise sky_pitch towards 31 (which moves the panorama's own sun up to meet the
; disc, and moves the ambient with it), or set sun_disc = 0 and let the HDRI's own hazy sun be the
; sun.  Both are live; tests\out\sky_sun.png is what the disc looks like against this panorama.
sun_disc = 1           ; 0 = no disc and no glow (the HDRI's own hazy sun is still in the panorama)
sun_disc_size = 2.0    ; the disc's angular DIAMETER in degrees.  The real sun is 0.53; 2 reads better
                       ; through a tone curve.  The edge is soft over half as much again
sun_disc_intensity = 1.0
sun_disc_r = 1.00      ; the disc's colour
sun_disc_g = 0.95
sun_disc_b = 0.86
sun_glow = 0.35        ; the soft halo around it, 0 = none
sun_glow_size = 12     ; the halo's half-brightness radius, in degrees
sun_glow_r = 1.00
sun_glow_g = 0.80
sun_glow_b = 0.55

; ---- the horizon ------------------------------------------------------------------------------
; The engine draws its sky faces with fog OFF, and distant terrain fades to D3DRS_FOGCOLOR (MM010:
; 0x777952, linear 10..1400 m).  So the sky has to arrive at that same colour where the two meet, or
; the far hills end in a visible line.  The DLL reads the fog colour off the device at the draw, so
; this follows whatever level is playing.
sky_fog = 1.0          ; 0 = the panorama as it is (the horizon will not match the terrain)
sky_fog_top = 2        ; degrees of elevation where the blend starts ...
sky_fog_bottom = -8    ; ... and where the sky is the fog colour and nothing else
sky_haze = 0.30        ; and this much of the same colour mixed back in ABOVE sky_fog_top, fading out by
sky_haze_top = 10      ; sky_haze_top degrees.  The HDRI is brightest right at 0 degrees while this level's
                       ; own sky is dull at the horizon and peaks about 11 degrees up, so a little haze puts
                       ; the bright band back where the original's sits.  These four are exactly what
                       ; work\sky's own bake of the five 256 px faces does, so the dome is the sky you
                       ; already have -- at four times the resolution and with no cube seams
sky_log = 0            ; 1 = one extra log line about the dome (a diagnostic)

; ======== PER-PIXEL LIGHTING ====================================================================
; The engine's lighting is the reason this game still looks 2005, and it works two ways, neither of
; them per pixel:
;   * TERRAIN, BUILDINGS, ROCKS (the declaration path): ONE baked colour per vertex is the light --
;     sun, shadow and bounce, all of it, flat across each triangle.
;   * PROPS, VEHICLES, CHARACTERS, FOLIAGE (the FVF lit path): a flat ambient per object plus one
;     per-vertex N.L from the level's own directional light 0, and on 2005 meshes a triangle is
;     often metres across.
; This replaces that shading -- per pixel -- on the draws the DLL can recognise safely.  It does NOT
; add a pass: it binds its own vs_3_0/ps_3_0 to the game's own draw and issues that same draw, so
; the blend, the alpha test, the depth test, the stencil and the colour mask are all still the
; game's, a fading prop still fades and an alpha-tested ladder keeps exactly the holes it had.
;
;   light  =  base                                          (mode 1 keeps the engine's own light here)
;          +  sun_colour  x sun_intensity x N.L x shadow    (the LEVEL's own direction, read every frame)
;          +  sky_colour  x sky_intensity x SH(N) x AO x bake   (the HDRI's own irradiance, 9 coefficients
;                                                            baked from the very panorama the sky dome
;                                                            draws -- tod_hd_fx\light\sh.txt)
;   colour =  albedo x light + specular
;
; `shadow` is read out of the level's OWN bake -- ON THE DECLARATION PATH.  Below 0.55 of
; baked_reference the bake says this surface is in shade, above 1.45 it says it is in open sun.  That
; is the only real shadow information this level has (there is no shadow map outside the camp), and
; it is what stops the new sun from lighting what the game says is dark.  On the FVF LIT path there
; is no bake at all -- what the engine has there is a flat per-object ambient, which is a zone tint
; and not a shadow -- so there the ENGINE'S OWN per-object light-0 flag is the whole shadow, and the
; sun is either on for that object or off.  (Until 2026-09-20 that path read a shadow out of the
; ambient anyway, and every sunlit prop, vehicle, character and tree got 0.366 of the sun the terrain
; got.  `lighttest sh` now draws the same 24 normals on both paths and checks they match.)
lighting_mode = 1      ; 0 = OFF: the game's own lighting, byte for byte.  The hook returns at its
                       ;     first line -- not one D3D call is made and not one state is read.
                       ; 1 = ADD (shipped): the engine's own light is kept and ours is added on top,
                       ;     gated by that shadow.  It SHARPENS -- a Gouraud N.L across a 4 m
                       ;     triangle becomes a real one -- rather than flooding the level.  Safe:
                       ;     nothing the game drew is lost.
                       ; 2 = REPLACE: the picture's light is ours.  The bake's LEVEL is normalised
                       ;     away and only what is left is kept -- `shadow` for the sun, `neutralise`
                       ;     for the sky.  This is the one to look at to judge what the game COULD
                       ;     look like, and it needs bigger intensities (see below).
                       ; Anything else is read as 0.  All three are live.
sun_intensity = 0.30   ; the sun's strength.  The DIRECTION is the level's own light 0, read off the
                       ; device every frame; the COLOUR is sun_colour below (the level's own light-0
                       ; colour is not multiplied in -- in MM010 it is white anyway).  0 = no sun.
sun_colour_r = 1.00    ; the sun's colour, per channel.  Warm, like a sunrise.
sun_colour_g = 0.95
sun_colour_b = 0.86
sky_intensity = 0.08   ; x the sky's own irradiance.  0 = no ambient from the sky.
sky_colour_r = 1.00    ; x it, per channel
sky_colour_g = 1.00
sky_colour_b = 1.00
                       ; FOR MODE 2, the pair measured to keep the frame's mean brightness AND its
                       ; contrast, its highlights and its shadows closest to the game's own
                       ; (lighttest look, on the offline scene: mean +0.8 %, standard deviation x0.99
                       ; of the game's, 0 px blown to white, 0 px taken from visible to black) is:
                       ;     lighting_mode = 2
                       ;     sun_intensity = 0.55
                       ;     sky_intensity = 0.42
                       ; The keys mean the same thing in both modes; mode 2 needs more of them
                       ; because it replaces the engine's own light instead of adding to it.  At the
                       ; shipped 0.30 / 0.08 mode 2 is much darker than the game (-25 %) and 0.19 %
                       ; of the frame goes black, which is why that pair is written out here.
ao_influence = 0.60    ; 0..1: how much the SSAO (`ssao` above) occludes OUR sky term.  It is the
                       ; PREVIOUS frame's -- the gather runs at the game's copy draw, after every 3D
                       ; draw, exactly like the soft particles' depth -- so at 60 fps it is a
                       ; centimetre or two stale.  Note that `ssao` ALSO darkens the whole frame at
                       ; the composite, so the ambient is occluded by both: lower this (or
                       ; ssao_strength) if creases read as dirt.  0 = our sky term is never occluded.
                       ; It reads WHICHEVER buffer ao_mode made -- the 12-tap sampler's or HBAO's -- so
                       ; ao_mode = 1 changes what lights the world, not just what is composited over
                       ; it.  With lighting_mode = 2 that is the whole reason HBAO was worth doing.
specular = 1.00        ; 0..4: x the material class's own specular (tod_hd_light.txt beside this
                       ; file).  A Blinn highlight from the SUN only, with a Schlick Fresnel; the
                       ; environment's own reflection is `shine`'s job and doubling it here would be
                       ; wrong.  0 = no highlight.
shadow_influence = 1.0 ; 0..1: how much of the SHIPPED bake's own darkness gates our sun.  1 = the
                       ; level's shadows are kept exactly as they are; 0 = everything the sun faces
                       ; is lit, which is what a level with no shadow map looks like without this.
baked_reference = 0.55 ; the DECLARATION path's mean light, which is what "in shadow" is measured
                       ; against.  0.5517 is measured: all 6,026,645 baked vertex colours of the
                       ; installed MM010 jungle.  Another map
                       ; may want another number; raising it makes more of the level count as shadow.
fvf_reference = 0.56   ; the same thing for the FVF LIT path, whose "engine light" is D3DRS_AMBIENT x
                       ; the material's ambient + emissive and is NOT on the bake's scale.  0.5590 is
                       ; measured on the project's own census of the real game
                       ; (work\wrapper\foundation\logs\run_ko_b): the mean over its 9,216 lit world
                       ; draws.  It is what sky_bake_occ measures that path's own darkness against;
                       ; the path's SHADOW is the engine's light-0 flag and does not use it.
neutralise = 1.00      ; mode 2 only, 0..1: how much of the bake's LEVEL survives as an occlusion
                       ; hint on the sky term.  0 = the bake is thrown away entirely (flat ambient).
colour_keep = 0.35     ; mode 2 only, 0..1: how much of the bake's HUE survives as bounce tint -- the
                       ; green under a canopy, the warm bounce off a wall.  Its LEVEL never does.
sky_bake_occ = 1.00    ; MODE 1 only, 0..1 (mode 2 uses `neutralise` for exactly this).  How much the
                       ; ENGINE's own light gates OUR sky ambient: at 1, a surface the level lights at
                       ; half its own mean gets half the sky fill; at 0, the HDRI's open sky is added
                       ; to everything.  This is what keeps a sunrise out of a hangar, a temple
                       ; interior or a cellar -- the artists baked those places dark, and that is the
                       ; only evidence the DLL has that they are enclosed.  Measured (lighttest
                       ; look): at sky_intensity 0.10 the places the level keeps dark are lifted
                       ; x1.381 with this at 0 against x1.146 for the places it lights well, and
                       ; x1.219 with it at 1.
sky_scope = 1          ; 1 = the sky ambient is applied only on a level whose sky the dome's own
                       ; manifest recognises -- i.e. the level tod_hd_fx\light\sh.txt was baked from
                       ; (MM010, the jungle).  sh.txt is ONE sky: a sunrise panorama.  On a night
                       ; level, or any map with another sky, adding it would be plainly wrong, so it
                       ; is not added and the log says `sky ambient OFF`.  The sun, the specular and
                       ; everything else still work there -- only the HDRI's ambient is scoped.
                       ; It is armed by a recognised sky-face draw within the last 120 frames (two
                       ; seconds at the cap), so one frame that happens not to draw the sky cannot
                       ; make the light flicker.  If a level ever went two seconds without drawing its
                       ; skybox the ambient would switch off and back on, which would be a visible
                       ; step in brightness; in MM010 the five faces are the first five draws of every
                       ; frame, so it cannot happen there.  0 = apply it on every level whatever sky
                       ; it has -- which is also the answer if that step is ever seen.  Live.
light_debug = 0        ; 0 = off.  1 = the albedo alone (no lighting at all), 2 = the lighting alone
                       ; (no texture), 3 = the ambient occlusion, 4 = world normals.  Live, and the
                       ; quickest way to see what the shader thinks the world is made of.
lighting_verify = 0    ; 1 = on every draw it takes, read the state again and check it against the
                       ; cached verdict, logging any disagreement.  A diagnostic: it makes the
                       ; feature much slower and is how the gates prove the cache.
lighting_log = 0       ; 1 = one extra log line (a diagnostic)

; ---- the sun's highlight: how narrow and how strong it is allowed to get -----------------------
; The Blinn exponent of a roughness r is 2/r^4 - 2, and its energy normalisation rises with it: the
; `glass` row's 0.05 asked for an exponent of 319,998 amplified 10,000x.  That is a tenth-of-a-degree
; lobe, and on 2005 geometry -- no normal maps, and a windscreen is ONE flat normal across the whole
; pane -- it is not a highlight but a sub-pixel spike that clips to pure white, flashes the whole pane
; at once and crawls as the camera moves.  These two keys bound it.  Both are live, and 0 turns each
; one off (the raw formula).  Neither touches the `default` row, so light_classes = 0 is unaffected.
light_rough_floor = 0.18 ; 0..0.5: the sun's lobe is never narrower than this roughness (about 1.5
                       ; degrees), so it is at least a pixel or so wide on real geometry.  Every class
                       ; rougher than it is untouched; glass, water, chrome and car paint share the
                       ; lobe and are told apart by F0, `metal` and `reflect` instead.
light_spec_max = 0.80  ; 0..64: caps (the specular normalisation x the class's own `specular` column),
                       ; so no class can reach a peak that blows out.  `default` sits at 0.392, well
                       ; under it.  Raise it for a harder highlight; `specular` scales everything.
light_energy = 1       ; 1 = the diffuse is scaled by (1 - metal), so the conductor rule below MOVES
                       ; energy into the highlight and the reflection instead of adding it.  0 = the
                       ; release before 2026-09-20.  Every class with metal = 0 is the same either way.

; ---- per-material roughness and specular (the texture -> material-class map) ------------------
; Until 2026-09-20 every relit draw took the `default` row of tod_hd_light.txt, so metal, cloth and
; concrete all got the same highlight.  They no longer do: tod_hd_fx\light\classes.txt lists which
; MATERIAL CLASS each of the 4,401 classified textures the game installs is, and the installer turns
; that list into tod_hd_fx\light\manifest.txt -- what those textures' bytes are -- from the archive
; it packs, so a rebaked texture can never leave a stale entry behind.  A texture in neither file
; still takes `default`, exactly as everything did before.
; TO FIX A WRONG MATERIAL: edit ONE line of tod_hd_fx\light\classes.txt (the class word), or change
; the class's own numbers in tod_hd_light.txt, which is re-read live.
light_classes = 1      ; 0 = the map is not even read, not one texture is hashed for it and EVERY draw
                       ; takes `default`: the release before this feature, byte for byte.  Live.
light_classes_verify = 0  ; 1 = also SHA-256 every classified texture and check it against the manifest
                       ; row the cheap key answered with.  A diagnostic, and slow: the cheap key is a
                       ; CRC32 of level 0 (1544 MiB/s) instead of a SHA-256 (151 MiB/s), which is what
                       ; makes a class map affordable at level load -- 38 ms for MM010 instead of 0.39 s.
light_env_stage = 0    ; ONE LIGHT PER TEXTURE (flicker2, KEEP.md 53).  The game draws some objects with
                       ; its own reflection stage at some moments and without it at others; this DLL
                       ; cannot light a draw that carries that stage, so the game drew it -- and a crate
                       ; or a car panel switched between this DLL's light and the game's as the camera
                       ; moved (a complete change of tone).  1 = a texture this DLL has lit once is lit
                       ; every time, stage or not (the game's gloss on it is dropped; the DLL's own
                       ; reflections stand in).  Textures that ALWAYS carry it (weapons, windscreens)
                       ; keep the game's look.  0 = as before.  Live.
shine_gloss_from_class = 0 ; THE RECONCILIATION between this file's `roughness` and tod_hd_shine.txt's
                       ; `gloss`: they describe the same property of the same surface and should not
                       ; disagree.  1 = a shine material whose texture has a class reads the HDRI at
                       ; the blur level that class's roughness asks for (sharp < 0.16 <= car < 0.32 <=
                       ; soft < 0.60 <= rough).  0 (SHIPPED) = each material's own `gloss` word wins,
                       ; which is the release before this feature, exactly.  It ships OFF because the
                       ; 28 `gloss` words were tuned BY EYE against the picture being played, and a
                       ; class roughness is a whole class's average: turning it on is an A/B to look
                       ; at, not a correction to apply unseen.  The log names every material it moves
                       ; and from what to what either way.

; ---- screen-space reflections ------------------------------------------------------------------
; The DLL marches the PREVIOUS frame's scene colour and depth for a real reflection on the surfaces
; whose material class says they reflect -- vehicles, glass, chrome, wet ground, water, metal props.
; Where the ray leaves the screen, finds nothing, or passes behind geometry, it falls back to the HDRI
; environment (the very sky the dome draws), so a reflection is never black.  Both buffers are one
; frame old for the reason the soft particles are (a 3D draw cannot read the depth its own frame is
; still writing), and the camera they were made with is uploaded with them, so only their CONTENT is
; a frame behind.  It rides inside the lighting's own draw, so the HUD, 2D, particles and the sky --
; which the lighting path already refuses by name -- can never get one.
ssr = 1                ; 0 = the plain shader is bound on every draw: not one march instruction runs.
ssr_intensity = 1.0    ; 0..2, x each class's own `reflect` column in tod_hd_light.txt
ssr_steps = 24         ; 8..64 march steps.  THE QUALITY KNOB: 16 is cheap and slightly steppier, 48
                       ; finds thinner geometry.  (`ssr_quality` is accepted as the same key.)  At 24
                       ; the march resolves only a few per cent of the pixels it runs on -- the rest
                       ; find nothing on screen at all -- so a reflection is dotted rather than solid.
ssr_max_distance = 40  ; metres the ray may travel before it gives up and takes the HDRI instead
ssr_thickness = 0.6    ; metres: how thick a surface in the depth buffer is treated as being.  A ray
                       ; that ends up further behind it than this went PAST it, through a gap the
                       ; depth buffer cannot describe, and is a miss.  Too large = smeared reflections
                       ; behind objects; too small = reflections that drop out.
ssr_fade_edge = 0.12   ; 0..0.5: the share of the screen over which a hit fades out at the border, so
                       ; a reflection does not cut off at the edge of the picture
ssr_roughness_cutoff = 0.4 ; a class rougher than this never marches.  At 0.4 the marching set is the
                       ; genuinely reflective one -- water, glass, chrome, car paint, vehicle detail,
                       ; waterfall, wet ground, tile, plastic, emissive.  0.6 adds the 757-texture
                       ; `metal` class, which is most of the panelling, roofing and containers in the
                       ; game: that is the setting to test the frame rate on (see light_spec_max's own
                       ; note above and KEEP.md 15.5 for the measured worst case).
ssr_env = 0.0          ; 0..2: the weight of the HDRI ENVIRONMENT where the ray misses.  This is NOT
                       ; the screen-space march: it is a flat picture of the sky added to every class
                       ; with `reflect` > 0, and at 1.0 it was about 96 % of what `ssr = 1` put on the
                       ; screen -- a large global brightening that hid the march itself.  It ships at
                       ; 0 so `ssr` means the march; set it to 1.0 to see the environment add, which
                       ; is a separate look and a separate decision.  It is forced to 0 anyway on a
                       ; material tod_hd_shine.txt already lists, because that pass is already adding
                       ; the HDRI there and doubling it is wrong.
ssr_debug = 0          ; 0 = off, 1 = the reflection term alone, 2 = green where the ray HIT, red
                       ; where it missed and took the HDRI.  Live.

; ---- emissive lights: fires, lamps and the engine's own point lights light the world ------------
; In lighting_mode = 2 the bake's level is divided out, and the light the artists baked around every
; lamp and campfire goes with it: a street lamp at night lights nothing.  This puts it back as REAL
; per-pixel point lights (no shadows), from three sources:
;   * the ENGINE's own D3D point and spot lights -- on the objects the ENGINE lit with them (its
;     characters, vehicles and props; never the ground or the walls), at the engine's own strength
;     and fall-off.  They are soft fill lights, most of them hanging where no lamp is (2026-09-23);
;   * the FIRE and EXPLOSION sprites -- one light per fire at the centre of its sprites, as bright as
;     they are opaque and flickering with them -- and muzzle FLASHES while they are drawn visibly;
;   * LAMPS: the lamp glare billboards and every draw of an `emissive`-class texture (bulbs, neon,
;     signs, sirens), at the object's own position.
; Which textures are sources, their colour, reach and strength: tod_hd_fx\light\emitters.txt (live).
; The list is built from what the frame SAW and used by the next one (a fire is drawn after the wall
; it lights), and a lamp the engine stops drawing because it is behind you keeps lighting for
; emissive_persist seconds.  All draws of a frame share the emissive_count fire / lamp / flash lights
; nearest the eye (a lamp drawn as a head, a glare and a cone is ONE light).
; MODE 2 ONLY.  In lighting_mode = 1 the bake is kept and it already holds the lamps' light, so this
; would light them twice: there it does NOTHING, and the log says so (the interlock).
emissive_lights = 0    ; 0 = OFF: the previous release, byte for byte -- not one state is read and not
                       ; one constant is written.  1 = on (in lighting_mode = 2).  Live.
emissive_intensity = 1.0 ; 0..8, x every source's own colour x intensity (emitters.txt)
emissive_range = 1.0   ; 0.25..4, x every source's own reach.  The light reaches EXACTLY zero there,
                       ; so it never draws a hard edge.
emissive_count = 4     ; 1..8 lights a frame.  Each costs every lit pixel one more loop iteration.  A
                       ; light is handed over to the next nearest smoothly, so a busy street does not
                       ; pop -- raise this if lights visibly fade as you walk between them.
emissive_distance = 60 ; metres: a source whose sphere is further from the eye than this is not
                       ; chosen (it fades out over the last quarter)
emissive_falloff = 16  ; 0..64: how fast a light dims INSIDE its range -- 1 / (1 + falloff (d/r)^2).
                       ; 0 = flat to the edge, 16 = half strength at a quarter of the range.
emissive_flicker = 0.35 ; 0..1: how much of a fire's own frame-to-frame brightness reaches its light.
                       ; 0 = a steady glow, 1 = every sprite's fade, raw.
emissive_specular = 1.0 ; 0..4, x each material class's own specular: the lamps' highlights on wet
                       ; ground, glass and metal
emissive_occlusion = 0.5 ; 0..1: how much the ambient occlusion dims the emitters' light.  They cast no
                       ; shadow, so this is the only thing that keeps a lamp from lighting the far side
                       ; of a crate.
emissive_engine = 1    ; the engine's own point / spot lights, on the objects it lit with them, as it lit
                       ; them (0 = not).  Not counted in emissive_count: they are per object.
emissive_sprites = 1   ; the fire, explosion, muzzle-flash and lamp-glare sprites are sources
emissive_models = 1    ; the draws of an emissive-class texture are sources (needs light_classes = 1)
emissive_persist = 15  ; 0..120 s: a lamp not drawn for this long fades away
emissive_log = 0       ; 1 = every summary also lists the lights chosen (position, range, colour)
emissive_select = 0    ; WHICH lamps light a thing (lightflicker, KEEP.md 49).  0 = the emissive_count
                       ; lamps nearest the CAMERA, shared by everything in the frame (every release so
                       ; far) -- so a car, a barrel, a hemp stack or Ram next to a lamp brightens and
                       ; darkens as the camera moves round him, and a far lamp the camera stands under
                       ; lights things it cannot reach.  1 = every object with a position of its own
                       ; (vehicles, characters, props) takes the lamps nearest ITSELF: the camera no
                       ; longer changes its light.  The level's own geometry (no position of its own)
                       ; keeps the camera's choice.  Live.  Costs ~0.3 ms in a worst case of 600 lit
                       ; props each at its own spot; the game's parts share a spot per object.

; ---- local reflections: reflections that show the place you are in, not one open sky ------------
; Every reflection the DLL draws -- the engine's own on weapons and cars (env), the props it gives
; none (shine) and the SSR where a ray misses -- reads ONE HDRI panorama, so a gun in a hangar
; reflects an open sky.  This rebuilds that map once a frame from the frame itself: a direction the
; camera SAW takes what it saw there, and a direction it did not (behind you) takes the HDRI,
; pulled towards the frame's own average colour as far as the place is ENCLOSED (how much of the
; upper part of the last frame is nearer than local_reflections_open metres rather than sky).  It is
; not a real probe: it only knows what the camera saw, from where the camera stands, one frame ago.
; Works in every lighting mode (it changes what the reflections READ, not the lighting).
local_reflections = 0  ; 0 = OFF: every reflection reads the HDRI exactly as before, byte for byte;
                       ; nothing is created.  1 = on.  Live.
local_reflections_screen = 1.0 ; 0..1: how much of a direction the camera saw comes from the frame
local_reflections_enclosure = 1.0 ; 0..1: how far an enclosed place pulls the unseen directions to
                       ; its own average colour (0 = the HDRI for everything the camera did not see)
local_reflections_gain = 1.0 ; 0..4: brightness of what comes from the frame (the HDRI maps carry
                       ; a reflectance of ~0.3 baked in; the frame's colours take the same, x this)
local_reflections_open = 250 ; metres: anything in the last frame further away than this counts as
                       ; open sky when deciding how enclosed the place is
local_reflections_smooth = 0 ; flicker2 (KEEP.md 53): 0 = as before.  30..3000 ms: how enclosed the place
                       ; looks and its average colour -- which tint every reflection -- follow the
                       ; camera over this long instead of jumping in one frame (look down at the ground
                       ; and the tractor's paint no longer turns brown at once).  300 is a good value.
local_reflections_edge = 0.25 ; with the above: what the camera sees fades into the reflections over this
                       ; share of the screen's border (was 0.08).  0.08..0.5

; ---- volumetric beams: real light shafts instead of the painted ones -------------------------------
; The jungle's canopy shafts are flat additive sprites (the texture `light_beam`, 30 of them in MM010,
; 1 x 64 m to 8 x 64 m, each turning to face you), and the lamp cones are textured cone MESHES
; (`streetlight_cone01`: BigSpotLightCone, OverheadLamp_Cone, Streetlight_Cone).  With this on, the DLL
; refuses those draws BY TEXTURE and marches a real volume in their place, built from each refused draw
; itself: the sprite's own quad and world matrix give the shaft's position, slant, width and length
; (the artists' placements, not a table), and a cone takes its mesh's apex and base rings from
; tod_hd_fx\volumetric\cones.txt.  A beam stops where it meets the ground, a wall or a tree (the game's
; own depth of the SAME frame, letterboxed cutscenes included), you can walk into it and look up it (brighter looking
; towards the light), and drifting dust moves along it.  Shafts take the sun's colour (shaft_colour_*
; above) x the sprite's own opacity; cones keep their own colour.  One pass a frame, at half
; resolution, at the game's final copy of the frame.  Needs depth = 1.  KEEP.md section 26.
volumetric_beams = 0   ; 0 = OFF: the painted sprites, byte for byte -- not one draw is refused and
                       ; nothing is created.  1 = on.  Live.
volumetric_intensity = 1.0 ; 0..8: how much light a beam adds.  1 = about the painted sprite's own
                       ; brightness seen from the side
volumetric_density = 1.0 ; 0..8: how quickly a long look along a beam saturates (looking up a shaft
                       ; towards the sun).  Higher = thicker, more solid shafts
volumetric_noise = 0.5 ; 0..1: how much drifting dust breaks the shafts up.  0 = smooth light
volumetric_noise_scale = 0.35 ; dust cells per metre (bigger = finer dust)
volumetric_noise_speed = 0.15 ; metres a second the dust drifts along the beam.  0 = frozen
volumetric_steps = 16  ; 4..48 samples marched per half-resolution pixel.  More = smoother, costs more
volumetric_coverage = 2.0 ; 0.25..16: how much screen the beams may cover at full steps, in SCREENS
                       ; (the same share at any resolution).  Past it the steps fall in proportion
                       ; (never below 4) -- so standing inside a shaft costs what this allows
volumetric_anisotropy = 0.35 ; -0.9..0.9: how much brighter a beam is looking INTO the light than
                       ; across it (0 = the same from every side)
volumetric_cones = 1   ; 1 = the lamp cones too.  0 = only the canopy shafts
volumetric_debug = 0   ; 1 = keep the painted draws AND draw the volume x4 over them (to check that the
                       ; volume sits where the artists put the beam)
volumetric_log = 0     ; 1 = every summary lists each beam (where, how long, how wide, how opaque)
; The light the beams CAST: where a canopy shaft or a lamp cone reaches the ground, a wall or a character,
; that surface is lit -- a warm dappled pool on the jungle floor, a lit disc under a lamp.  It follows the
; beam's own shape and dust, faces the light (a wall edge-on to the shaft stays dark), and a trunk or a
; person standing in the shaft casts a shadow line on the ground behind it.  Needs volumetric_beams = 1.
volumetric_light = 0   ; 0 = OFF: the beams exactly as before, byte for byte.  1 = on.  Live.
volumetric_light_strength = 2.5 ; 0..8: how much brighter a surface in the middle of a beam gets
                       ; (x the beam's colour and the sprite's own opacity; 2.5 = about +80% in a typical shaft)
volumetric_light_shadows = 1 ; 1 = what stands in the beam casts a shadow; 0 = no shadows (cheaper)
volumetric_light_shadow_distance = 8 ; 1..40 m: how far back up the beam a shadow can come from
; ---- terrain triplanar: no more vertical streaks on steep hillsides ------------------------------
; The terrain's UVs are laid for ground seen from above, so on a steep face each texel is stretched
; down the slope.  On STEEP faces only, two more projections of the same texture (along world X and
; Z) are blended in at that texture's own world scale; flat ground keeps its own texel exactly.
; Which textures, and at what scale: tod_hd_fx\terrain\triplanar.txt (45 natural ground / rock /
; grass textures measured off the game's own terrain meshes; never a wall, road or hand-mapped cliff).
; A MACRO texture there (the desert mountains, one painting over a whole massif) keeps its own colour;
; its steep faces take isotropic detail from the same painting, side-projected much finer.
; Needs lighting_mode 1 or 2 (it rides in the lighting's shader).  The parallax fades out exactly as
; the triplanar takes over, so a steep face has none.  With tex_pbr the normal and ORM maps are
; blended the same way, each projection's normal turned into its own frame.
terrain_triplanar = 0  ; 0 = OFF: nothing is created, read or bound -- the previous release, byte
                       ; for byte.  1 = on.  Live.
triplanar_slope_start = 0.80 ; the slope where the blend begins, as the surface normal's upward part
                       ; (0.80 = 37 degrees).  Lower = only steeper faces are touched
triplanar_slope_full = 0.55 ; ... and where the side projections have it all (0.55 = 57 degrees)
triplanar_sharpness = 4 ; 1..16: how sharply a face picks the X or the Z projection (higher = narrower
                       ; blend seams on ridges, lower = softer but more double-image)
triplanar_scale = 1.0  ; 0.25..4: x every texture's own metres per repeat (bigger = larger texture)
triplanar_macro_detail = 16 ; 2..64: a mountain painting keeps its own colour on a steep face and takes
                       ; rock detail from itself, side-projected this many times finer (bigger = finer)
triplanar_debug = 0    ; 1 = paint the side projections' share red (see exactly where it acts)
; ---- terrain rock: the existing terrain as sharp, modern hard rock (the mesh is not changed) ------
; A material in the lighting's pixel shader, on the triplanar's own textures:
;   * FLAT FACETS on steep ground: the triangle's own plane lights it instead of the smoothed vertex
;     normal, so the big 2005 triangles read as crisp rock planes; gentle ground stays smooth;
;   * three SCAN layers (CC0 photo sets): cliff rock on steep faces, scree on the middle slopes, dust
;     on gentle ground, their borders broken up by macro noise and decided by the scans' own heights.
;     The GAME'S colour stays the colour -- a scan only adds light and dark detail -- plus a close-range
;     detail layer, a macro variation against tiling and a per-texture tint with strata bands;
;   * PARALLAX on the cliff layer: the rock's relief shifts with the view up close.
; Which textures, which scans, and each one's tint / parallax / facet / slope thresholds / contrast:
; tod_hd_fx\terrain\rock.txt (one row per triplanar texture, written for every level by
; tools\make_rock_table.py from each texture's colour, name and where it lies).  The scans are
; tod_hd_fx\terrain\rock\*.dds.  Needs terrain_triplanar = 1 AND lighting_mode 1 or 2.
terrain_rock = 0       ; 0 = OFF: nothing is created, read or bound -- the previous release, byte
                       ; for byte.  1 = on.  Live.
rock_facet = 1.0       ; 0..1: x every row's facet strength (0 = smooth normals everywhere)
rock_facet_start = 0.90 ; the slope where the facet starts to take over, as the normal's upward part
                       ; (0.90 = 26 degrees) ...
rock_facet_full = 0.70 ; ... and where it has it all (0.70 = 46 degrees)
rock_parallax = 1.0    ; 0..3: x every row's parallax depth (0 = no parallax march at all)
rock_parallax_fade = 40 ; 5..200 m: the parallax is gone by this distance (it fades over the last 40 %)
rock_steps = 8         ; 4..16 parallax height steps (more = cleaner relief, costs more)
rock_contrast = 1.0    ; 0..2: x every row's scan contrast (how much light / dark detail the scans add)
rock_normal = 1.0      ; 0..3: the scans' surface relief in the lighting
rock_detail = 0.45     ; 0..1: the close-range detail layer (the cliff scan again, finer)
rock_detail_scale = 4  ; 1.5..16: how many times finer than the cliff scan the detail layer is
rock_detail_fade = 25  ; 2..100 m: the detail layer is gone by this distance
rock_macro = 0.5       ; 0..1: the large-scale brightness variation that hides tiling
rock_macro_scale = 120 ; 10..500 m: its size (it also fades to a third between 40 and 200 m away)
rock_blend = 0.6       ; 0..2: how much the scans' heights decide where two layers meet (0 = a plain
                       ; cross-fade by slope; higher = the higher material wins, a crisper border)
rock_band_period = 6   ; 1..50 m: the height of one stratum of the tint band (the rows' `band`)
rock_debug = 0         ; 1 = the layers as colour (red cliff, yellow scree, blue dust); 2 = the facet
                       ; share painted red
; ---- dynamic cast shadows: characters and vehicles cast a real shadow from the sun ------------------
; The level's own shadows are baked into it; nothing that MOVES is, so a character crossing open
; ground or a car on a road cast nothing at all.  This draws every character, the gun in its hand and
; every part of every vehicle a second time -- right after the game draws it, with the very same
; vertices -- into a sun shadow map around the player, and the per-pixel lighting reads that map.
; What casts is decided by the texture's installed KEY (tod_hd_fx\light\manifest.txt): anything in
; data/textures/characters, data/textures/animals, data/textures/weapons, data/models/vehicles* and
; data/textures/vehiclegenerics -- never the terrain, a building, a rock, a tree or a prop, whose
; shadows are in the bake already.  Windows and lamps (class glass / emissive) cast nothing.
; It is received in lighting_mode = 1 AND 2 and does nothing in lighting_mode = 0.  Where the bake
; already has the spot in shade, a caster makes it no darker: the two are combined with MIN.
dyn_shadows = 0        ; 0 = OFF: the previous release, byte for byte -- the caster hook returns at its
                       ; first line and every draw keeps its old shader.  1 = on.  Live.
dyn_shadow_strength = 0.85 ; 0..1: how much of the sun a caster takes away (1 = all of it; the sky's
                       ; light still reaches the shadow, so it is never black)
dyn_shadow_base = 0.55 ; 0..1, lighting_mode = 1 only: the share of the BAKED light that is sunlight,
                       ; which a caster also takes away where the bake says the ground is in sun
dyn_shadow_range = 30  ; 8..120 m: the map covers this far from its centre, which sits half this far
                       ; AHEAD of the camera.  Smaller = sharper shadows over less ground.
dyn_shadow_size = 2048 ; 512 / 1024 / 2048 / 4096 texels across (2048 at 30 m = 29 mm a texel;
                       ; 32 MB of video memory, 4096 = 128 MB)
dyn_shadow_casters = 7 ; which things cast: 1 characters + 2 vehicles + 4 the weapons they hold
dyn_shadow_max_casters = 160 ; caster draws a frame, at most (a busy street is ~60; the rest wait)
dyn_shadow_bias = 0.03 ; metres: keeps a car body from shadowing itself in stripes ("acne").  The
                       ; terrain is never in the map, so it cannot shadow itself at all.
dyn_shadow_slope_bias = 0.06 ; metres, added where the surface is at a grazing angle to the sun
dyn_shadow_normal_offset = 0.03 ; metres: each point is looked up this far out along its normal
dyn_shadow_softness = 1.0 ; 0.5..4: the width of the shadow's soft edge, in texels of the map
dyn_shadow_debug = 0   ; 1 = paint the dynamic shadows RED, to see what casts and where it lands
; ---- which casters keep their shadow over the cap (KEEP.md 50, popfix) -------------------------
; Over dyn_shadow_max_casters the release keeps the casters the game happens to draw FIRST, and the
; game's draw order changes with the camera: turn it and a car's shadow can vanish and come back.
; With this on, the ones kept are the most important -- the biggest and nearest (size / distance) --
; whatever order they come in, a caster that had its shadow last frame keeps a bonus so two near-equal
; ones do not trade places, and a shadow that does come or go fades over a few frames instead of
; popping.  Under the cap it changes nothing.  All live.
dyn_shadow_select = 0  ; 0 = OFF: the release before it, byte for byte (the draw order decides).  1 = on
dyn_shadow_fade_frames = 6 ; 0..30 frames for a shadow to fade in or out (0 = it pops, as before)
dyn_shadow_hysteresis = 0.25 ; 0..2: the head start a caster that already has its shadow keeps (+25 %)
dyn_shadow_edge = 0    ; flicker2 (KEEP.md 53): 0 = as before (the shadow square sits half a range AHEAD of
                       ; the camera, so turning the camera swings it and shadows near its edge pop).
                       ; 1 = the square is centred on YOU -- turning never moves it -- and shadows fade
                       ; out over its outer dyn_shadow_edge_fade.  Shadows then reach dyn_shadow_range
                       ; metres all round instead of 1.5x that ahead: raise dyn_shadow_range to 40-45
                       ; with it if far shadows are missed (a texel grows from 29 to 39-44 mm).
dyn_shadow_edge_fade = 0.25 ; 0.06..0.5 of the square's half-width
; ---- STATIC SUN SHADOWS: buildings, terrain, rocks, props and foliage cast a real shadow ------------
; The dynamic shadows above cover only what MOVES; the static world's shadows were the bake's, which
; is one colour per vertex (a 2005 triangle is metres across).  This draws the static world -- every
; draw the per-pixel lighting takes, and the terrain -- ONCE per object into three cached sun shadow
; maps ("cascades": a fine one near you, a coarser one further out, a coarse one to the horizon), and
; the per-pixel lighting reads them.  The maps are fixed to the WORLD and only ever move by whole steps
; as you walk, so a shadow stands still when the camera moves (no shimmer, no swimming).  An object is
; drawn into a map when it first comes into view and never again while the map holds it, so a frame
; where nothing new appears costs one lookup per draw.  Alpha-tested foliage casts with its holes.
; What casts nothing: characters, vehicles and weapons (the dynamic shadows' own), anything whose
; position changes every frame, decals and the translucent layer (no depth write), sprites and effects.
; It darkens the SUN only, never the sky, and where the bake already has the spot in shade it makes it
; no darker (MIN, like the dynamic shadows).  Received in lighting_mode = 1 and 2; off in mode 0, on a
; level whose light 0 does not point down (night), and on a sky set with no sun (festival, overcast).
; Only what the game has DRAWN since the map last moved can cast: a building never seen from where you
; stand casts nothing until it has been on screen once.  70 MB of video memory at 2048 (280 MB at 4096).
static_shadows = 0     ; 0 = OFF: the previous release, byte for byte -- every hook returns at its first
                       ; line, nothing is made and every draw keeps its old shader.  1 = on.  Live.
static_shadow_strength = 0.85 ; 0..1: how much of the sun the static world takes away (the sky's light
                       ; still reaches the shadow, so it is never black)
static_shadow_range = 20 ; 5..80 m: about how far the fine cascade reaches from you.  Its texel is the power of
                       ; two nearest range / 614 m (20 m -> 31 mm, reaching 19.2 m): a power of two is what
                       ; keeps a shadow edge exactly where it was when the map moves.  The next two cascades
                       ; reach about range x ratio and range x ratio^2 (20 m: 77 m and 307 m).
static_shadow_ratio = 4 ; 2..8: how much further (and coarser) each next cascade is (rounded to a power of two)
static_shadow_size = 2048 ; 1024 / 2048 / 4096 texels per cascade (3 of them side by side; 2048 = 54 MB
                       ; + a 16 MB scratch tile, 4096 = four times that)
static_shadow_softness = 1.0 ; 0.5..4: the width of the shadow's soft edge, in texels of its cascade
static_shadow_penumbra = 1.0 ; 0..8: contact hardening, x the real sun's size -- sharp where a wall meets
                       ; the ground, softer far from it.  0 = the same edge everywhere.
static_shadow_bias = 0.03 ; metres: keeps a surface from shadowing itself in stripes ("acne")
static_shadow_slope_bias = 1.5 ; texels of the cascade, added where the surface is at a grazing angle
static_shadow_normal_offset = 1.0 ; texels: each point is looked up this far out along its normal
static_shadow_blend = 0.2 ; 0.05..0.5: the share of each cascade's reach over which the next one is
                       ; blended in -- no line where the resolution changes
static_shadow_budget = 160 ; objects drawn into the maps a frame, at most; the rest are drawn on the
                       ; next frames (a level load or a camera cut is spread out instead of a hitch)
static_shadow_settle = 3 ; 1..60 frames an object must be seen standing still before it casts (a door
                       ; swinging or a car the class map does not know never does)
static_shadow_casters = 7 ; which draws cast: 1 the terrain + 2 buildings / rocks (the baked path) + 4 props
                       ; and foliage (the lit path)
static_shadow_min_sun = 0.02 ; a sun dimmer than this (sun_intensity x sun_colour x the sky set's sun)
                       ; casts nothing -- a night level
static_shadow_debug = 0 ; 1 = paint the static shadows BLUE; 2 = the cascades (red near, green, blue far);
                       ; 3 = the static visibility alone, grey
; ---- THE WATER: the game's rivers, sea, pools and waterfalls, shaded by the DLL -----------------
; Which draws are water is decided by tod_hd_fx\water\water.txt beside the other payload (one line per
; texture: surface / fall / keep), matched against the textures the game really uploads through
; tod_hd_fx\light\manifest.txt -- so this needs light_classes = 1.  A water draw is then drawn by the
; DLL's own shader instead of the engine's flat scrolling texture: it REFRACTS what is under it (a copy
; of the frame taken at the first water draw), ABSORBS it by the depth of water the eye looks through
; (clear turquoise shallows, deep teal-blue in a few metres), REFLECTS the level's own sky and the
; frame itself (Fresnel: transparent looking down, a mirror at grazing angles), catches the level's
; SUN in a glitter path, gathers FOAM where it is shallow, puts CAUSTICS on the shallow bottom and
; fades in softly at the banks.  Waves: three layers of one generated wave map (a swell, a chop,
; ripples); on the MM010 river they flow with the engine's own scroll, down the river.  Waterfalls:
; streaked foam falling down the sheet.  Works in every lighting mode.
; water_mode = 0 is the previous release, byte for byte: nothing is read, created or drawn.
water_mode = 0         ; 0 = OFF.  1 = on.  Live.
water_absorb_r = 0.38  ; extinction per metre, red / green / blue: red goes first, then green,
water_absorb_g = 0.065 ;   which is what makes the shallows turquoise and the depths teal-blue.
water_absorb_b = 0.050 ;   Raise all three (or water_murk) for a muddier river.
water_murk = 1.0       ; 0..8, x all three: 0.5 = a clear pool, 2 = a muddy jungle river
water_colour_r = 0.060 ; the colour deep water scatters back (lit by the level's sun and sky)
water_colour_g = 0.280
water_colour_b = 0.320
water_tex_mix = 0.25   ; 0..1: how much of the game texture's own average colour tints that
water_reflection = 1.0 ; 0..2, x every reflection (the Fresnel itself is physical)
water_env_gain = 1.0   ; 0..4, x the sky / environment a reflected ray falls back to
water_sky = 1.0        ; 0..4, x the sky's light on the water's body
water_wave_size = 14   ; metres: the swell (the chop is ~1/3 of it, the ripples ~1/10)
water_wave_strength = 1.0 ; 0..3: how steep the waves are (0 = a mirror)
water_ripple = 1.0     ; 0..2: the finest ripples
water_swell = 1.0      ; 0..3: the broad swell rolling under the waves on still water (the sea, lakes, pools)
water_wave_speed = 1.0 ; 0..8: how fast still water drifts (a river flows at the engine's own speed)
water_sun = 1.0        ; 0..8: the sun's glitter on the water
water_glint = 1500     ; 50..20000: how sharp each sparkle is (lower = a broader, softer sun path)
water_foam = 1.0       ; 0..2: the foam where the water is shallow (0 = none)
water_foam_distance = 0.5 ; metres of water under which the foam gathers
water_foam_scale = 0.35 ; foam pattern repeats per metre
water_edge = 0.15      ; metres: the water fades in over this depth at a bank (no hard line)
water_refraction = 0.20 ; metres: how far the waves bend what is seen through them ...
water_refraction_pixels = 14 ; ... never more than this many pixels AT 800 WIDE (scaled to your
                       ; resolution: 53 px at 3024 wide)
water_ssr = 1          ; 1 = the reflection also marches the frame (the banks, trees and rocks appear in
                       ; the water); 0 = the sky / environment only (cheaper)
water_ssr_steps = 32   ; 4..48 march steps
water_ssr_distance = 80 ; metres a reflected ray may travel
water_depth_now = 1    ; WHICH DEPTH tells the water how deep it is.  1 = water that writes depth itself
                       ; (the sea, the pools) resolves THIS frame's depth just before it is drawn; water
                       ; that does not (the MM010 river) reuses the last frame's, reprojected.  2 = always
                       ; this frame's (no one-frame lag at the banks, one more small pass).  0 = never.
water_fall_speed = 4.0 ; metres a second the waterfall's foam falls
water_fall_foam = 1.0  ; 0..2: how white the waterfall is
water_alpha_ramp = 0.12 ; the game's own alpha over which the water fades in instead of being cut
water_caustics = 0.6   ; 0..4: the dancing light on the shallow bottom (0 = none)
water_shore_darken = 0.35 ; 0..1: the wet, darker shallows right at the water line
water_debug = 0        ; 1 = how deep (black 0 m .. white 4 m; RED = no depth), 2 = the reflection alone
                       ; (GREEN where it found the frame), 3 = foam (red) and caustics (green), 4 = waves

; ---- THE YARD DECALS: oil stains, tyre ruts, a puddle and damp wall feet on a level's own ground -----
; The engine tiles one texture per surface, so a stain under a pump or a rut worn in front of a garage
; door -- a UNIQUE mark on the ground -- cannot be painted into it.  The DLL draws them itself: a pack
; in tod_hd_fx\decal\ is a thin mesh draped over the shipped terrain and one image, drawn once a
; frame after the world (at the first effect sprite, or at the scene -> back-buffer copy when a frame
; has none).  The image DARKENS the ground the game has already drawn -- with the game's own light,
; texture and fog in it, so nothing is relit -- and a puddle ADDS the sky's reflection and the sun's
; glint.  Props, characters and vehicles standing on a mark hide it, because the depth buffer already
; holds them.  The one pack shipped is MM013's gas station (map06).  A pack draws only while one of
; its own level's ground textures is on screen (yard_decals_level), so no other map ever gets it.
; yard_decals = 0 is the previous release, byte for byte: nothing is read, created or drawn.
yard_decals = 0        ; 1 = draw the decal packs
yard_decals_strength = 1.0 ; 0..2: x how dark the stains, ruts and damp bands are (0 = none)
yard_decals_puddle = 1.0 ; 0..2: x the puddle's reflection of the sky and the sun's glint on it
yard_decals_distance = 250 ; metres: a pack further from the eye than this is not drawn
yard_decals_level = 1  ; 1 = only while one of the pack's own ground textures is on screen; 0 = always
yard_decals_debug = 0  ; 1 = the coverage in magenta (to see where the marks are)

; ---- THE FOREST: the DLL draws its own trees and ground cover ---------------------------------
; The jungle's forest walls are painted photo cards on flat panels.  The DLL recognises those panel
; draws, skips the ones it has replaced, and draws a real forest in their place: 26 species from
; tod_hd_fx\veg\veg.vgl at the positions in tod_hd_fx\veg\<level>.vgp, instanced, frustum-culled,
; LOD'd, impostored beyond 120 m, wind-animated, and lit by exactly the model above -- the same sun,
; the same 9 SH coefficients of the same panorama, the same AO, and the rows of tod_hd_light.txt
; named `bark`, `foliage` and `grass`.  The per-ground-texture densities and the per-card rules are
; in tod_hd_veg.txt beside this file, which the DLL re-reads live.
; veg = 0 is the release before this one, byte for byte: no file is opened, no texture is hashed for
; it, no draw is skipped and nothing is drawn.
veg = 1                ; the master switch.  Live: turning it on reads the library at the next poll.
veg_cards = 1          ; 1 = SKIP the painted forest-wall panel draws the placement file says it
                       ; replaced with trees.  A panel it did not replace is never skipped, and every
                       ; refusal is counted by name in `summary veg cards:`.  In MM010 that is 34 of
                       ; the level's 40 wall draws; the 6 it keeps are the mountain backdrop at
                       ; 460-550 m from the route and three outlying slivers.  0 = the game's own
                       ; panels, every one of them, exactly as before.
veg_cards_distance = 0 ; metres.  0 = the placement file's verdict alone.  Above 0, a panel keeps its
                       ; cards while the eye is FURTHER from its own bounding box than this, so the
                       ; far backdrop can stay painted while the near wall becomes trees.  (A chunk
                       ; submesh's box can span the level, so on those this is nearly always 0 --
                       ; which is why the per-DRAW rule above is the one that does the work.)
veg_density = 1.0      ; 0..1 of the trees the placement file holds.  Thinning is by a per-instance
                       ; blue-noise rank, so it takes trees out EVENLY and putting it back brings the
                       ; same trees back in the same places.
veg_distance = 600     ; metres: nothing is drawn beyond this, and -- with veg_cards_footprint = 1 --
                       ; no card is hidden that PAINTS further than this.  600, not the 260 the first
                       ; release shipped: the placement file now plants the far ridges out to 700 m of
                       ; the route as impostors (two triangles each), and it carries per panel the
                       ; radius that panel's own painting needs (294-594 m on the 35 it replaced).
                       ; Turn it down and the far-painting panels get their CARDS back by themselves
                       ; instead of leaving a bare valley -- that is the interlock, and the zipline
                       ; start is what it is for.
veg_lod_bias = 1.0     ; x every LOD switch distance.  The library's own distances were measured at
                       ; 3024x1964 with a 60 degree field of view (47.6 px per degree) and the DLL
                       ; already scales them by the real pixel density, so this is a taste knob:
                       ; 1.4 keeps the detailed meshes further out and costs more.
veg_lod_fade = 6       ; metres of DITHERED cross-fade before each switch, so a tree dissolves into
                       ; its next LOD instead of popping.  0 = a hard switch (and no doubled draws).
veg_lod_fade_mode = 0  ; flicker2 (KEEP.md 53.8): 0 = as before.  1 = the cross-fade above takes at most
                       ; veg_lod_fade_frac of the LOD band it ends (the farm hemp switches at 4.5 m, and
                       ; 6 m dithered its nearest plants from 0 m), a pack's pack.txt `lod_fade <m>` sets
                       ; its own width, and the dither pattern moves WITH each plant instead of standing
                       ; still on the screen while the plants slide through it (no crawl).  Live.
veg_lod_fade_frac = 0.25 ; 0.05..0.5, with the above
veg_wind = 0.45        ; 0..1 wind strength.  Two bands: the whole plant sways about its base and the
                       ; leaves flutter, both from the per-vertex stiffness and phase in the library.
                       ; 0 = a still forest.
veg_wind_dir = 250     ; degrees: the direction the wind blows towards, about world +y from +x.
veg_grass = 1          ; 1 = draw the ground cover as well as the trees.
veg_grass_density = 1.0  ; 0..1, multiplied by each ground texture's own row of tod_hd_veg.txt.
veg_grass_distance = 34  ; metres.  34 is the ground cover's own last LOD distance: beyond it a 0.3 m
                       ; grass clump is under a pixel and all it can do is shimmer.
veg_ground_lift = 0.02 ; metres a ground-cover card is lifted, so its base cannot z-fight the terrain.
veg_when = 2           ; WHERE IN THE FRAME.  0 = at the first EFFECT draw (a sprite the particle
                       ; manifest names): after the world and before the transparent passes, which is
                       ; where foliage belongs.  1 = at the first world draw after the sky, which
                       ; always happens but draws before the world's own early z.  2 = 0 with an
                       ; automatic, logged fall-back to 1 if eight frames in a row end without a
                       ; trigger.  Nothing is ever drawn after the scene -> back-buffer copy, so the
                       ; foliage can never land on the HUD.
veg_mip_bias = 0       ; 0..3 atlas mip levels skipped when a page is loaded.  The atlas is 60 MB of
                       ; DXT5 in D3DPOOL_MANAGED and this process is 32-bit and not large-address-
                       ; aware; 1 quarters it to 15 MB at half the texel density.  A page that will
                       ; not fit at all already skips levels by itself and says so in the log.  This
                       ; is the FLOOR: veg_mem_guard below may raise it, never lower it.  One page is
                       ; opened per frame, so a level load or a turn cannot cost thirteen at once.
veg_max_instances = 40000 ; the culling arena AND the dynamic instance stream.  40,000 x 36 B is
                       ; 1.4 MB; `summary veg:` prints how many are really drawn, and what they cost.
veg_debug = 0          ; 1 = a flat colour per LOD instead of the lighting: red LOD0, yellow LOD1,
                       ; blue LOD2, violet impostor.  The fastest way to see the LOD chain work.
; ---- the four keys the review's fixes added.  1 is the fixed behaviour and 0 is the build the review
; ---- read, so any one of them can be put back on its own.
veg_cards_footprint = 1 ; 1 = a painted panel is hidden only while veg_distance reaches as far as that
                       ; panel's OWN painting AND the eye is within veg_distance of the trees planted
                       ; under it.  The placement file carries both numbers per draw, because a
                       ; terrain chunk's bounding box spans the level and can decide nothing.  This is
                       ; what stops ONE hidden draw taking painted forest away across a kilometre
                       ; while the forest itself is drawn to 260 m -- the hole at the zipline start.
                       ; 0 = the placer's verdict alone, which is what the first release shipped.
veg_impostor_blend = 1 ; 1 = an impostor blends the two neighbouring yaw tiles (and the two pitch rows
                       ; where the elevation is between them), which is what the library's own format
                       ; prescribes and what makes 8 yaws enough.  0 = the nearest tile and a hard
                       ; pitch switch, which snaps through 8 painted views as you ride past.
veg_level = 1          ; 1 = draw nothing until the game has drawn a texture THIS level's placement
                       ; file names (one of its card keys or its ground keys) in the last two seconds.
                       ; mm010.vgp is MM010's, and without this it would be drawn on any map whose
                       ; playable area overlapped its placement box.  Same evidence and same window as
                       ; sky_scope.  0 = draw wherever the world position says.
veg_mem_guard = 1      ; 1 = before the first atlas page is opened, measure this 32-bit process's free
                       ; address space and what the driver says is left for textures, and drop a mip
                       ; level (or two) when the headroom is thin, with a log line saying so.  The
                       ; atlas is the one risk no offline gate can measure; this makes the mitigation
                       ; automatic instead of something to reach for after the game is unstable.
veg_levels = 0         ; 1 = every placement file in tod_hd_fx\veg is a level's own (mm010.vgp is the
                       ; jungle, map08.vgp the hacienda), and the one whose OWN textures are on screen
                       ; is loaded -- one at a time, the old one released first -- so each level draws
                       ; its own forest and a level never draws another's.  mm010.vgp is resident from
                       ; the start, so the first mission is exactly as before.  With veg_mem_guard = 1
                       ; a placement is only loaded with twice its size plus 32 MB of free address space.
                       ; 0 = the release before it: mm010.vgp alone, by fixed name, and no other file
                       ; is ever opened.

; ---- species packs: the desert (KEEP.md 18.13) -----------------------------------------------
; A pack is a folder tod_hd_fx\veg\<pack>\ with its own species library, atlas pages and placement
; files.  The one this release carries is `desert`: a separately downloaded pack -- four Joshua trees,
; four junipers, five yuccas, yucca litter -- and five scanned rocks, with their own textures at
; 2048 per species, planted on Virgillo's farm (map06) where the second mission's route (MM013
; Tommy Cruz: the canyon road, the gas station, the hemp farm) can see them and nowhere else.  It
; also hides the level's painted hedge cards and its grass billboards (KEEP.md 18.13.1).
veg_packs = 0          ; 1 (needs veg_levels = 1) = append every pack's library to veg.vgl at load and
                       ; treat its placement files as levels like the others: map06.vgp is made
                       ; resident by map06's own ground textures and draws only there.  Read with the
                       ; library, so a change takes effect at the next start.  0 = the release before
                       ; it: no pack folder is listed or opened.
veg_pack_fade = 0      ; 1 = a pack's trees fade out where the GAME's own plants do (KEEP.md 33): the
                       ; engine's quadtree fade formula on each tree's own size, with the pack's
                       ; `engine_fade` (tod_hd_fx\veg\<pack>\pack.txt; the desert's is 0.07, what map06
                       ; ships on its own desert trees).  A 4 m Joshua tree is whole to 70 m and
                       ; dithers out to nothing by 88 m, instead of standing to veg_distance and
                       ; turning into an impostor at ~90 m.  No impostor is ever drawn for such a
                       ; tree.  Only pack species with engine_fade are touched: MM010 and the hacienda
                       ; are exactly as they were.  0 = the release before it.  Live.
veg_pack_fade_scale = 1.0 ; 0.25..4: x the part of those distances past 15 m (the engine's own LodFactor).
                       ; 1.5 = whole to 98 m, gone at 125 m.  Live.
veg_scatter_sub = 0    ; 1 = the engine's SCATTERED card plants that a placement file marks SUBSTITUTE (the
                       ; yucca-textured SUR__Desert_Bush_02 on maps 03 and 10) are refused as they are drawn
                       ; and a 3D pack plant stands at each one's own world transform, fading over the
                       ; scatter system's own 20..30 m -- the engine keeps deciding where and how many.
                       ; 0 = the cards, exactly as before.  Needs veg_packs = 1.  Live.  (KEEP.md 18.13.3)

; ---- ground parallax (Track C) ---------------------------------------------------------------
parallax = 1           ; 0 = no parallax shaders (anisotropic filtering above still applies)
height_scale = 0.05    ; metres between black and white in a height map (the map's mean sits on the
                       ; polygon, so this is about +-2.5 cm).  Per texture it is multiplied by the
                       ; manifest's scale column (grass 0.7, bank leaves 0.8, the rest 1.0)
cavity = 0.25          ; darken ground below the mean a little (0 = off, 1 = black in the deepest cracks)
height_mip_bias = 1.0  ; sample the height maps this many mip levels blurrier: smoother, rounder relief,
                       ; less shimmer.  0 = every grain of the map, 2 = soft mounds only
reference = -1         ; polygon height in the map (0..1); -1 = each map's own mean (recommended)
steps_min = 12         ; ray-march steps looking straight down ...
steps_max = 48         ; ... and at grazing angles (max 64).  More = less "sliced" relief, more GPU
fade_start = 20        ; metres: full parallax closer than this ...
fade_end = 45          ; ... none beyond this
mip_fade_start = 2.0   ; also fade out where the height map is minified this many mip levels ...
mip_fade_end = 3.5     ; ... (relief finer than a pixel only shimmers); scales with screen resolution
min_cos = 0.20         ; at grazing angles the texture shift is limited as if the view were this steep
grazing_fade = 0.15    ; parallax fades out when the view is flatter than this (cosine to the normal)
max_offset = 0.20      ; metres: hard cap on how far any texel may shift

; ---- keys, testing, logging ------------------------------------------------------------------
toggle_key = 0x91      ; key that flips parallax on/off while playing (0x91 = Scroll Lock; 0x78 = F9;
                       ; 0 = no key).  Logged in todhd_fx.log.
debug = 0              ; 1 = paint the height the shader hit on every ground draw it takes (grey):
                       ; shows exactly which draws are recognised.  Never leave on.
reload_frames = 60     ; re-read this file every N frames (0 = only at start)
summary_seconds = 60   ; one summary line in the log this often (fps, limiter holds, draws)
log_every_frame = 0    ; tests only: one log line per frame

; Per-level lighting profiles. 0 restores the legacy jungle-only sky behavior.
; 1 selects dome, ambient and reflections from the level's sky-face texture hashes.
; Farm/train use an afternoon sky; city uses morning; factory/hacienda use clear midday.
; Dusk/overcast suppress synthetic sun and shafts. Only the current dome stays resident.
; Requires sky_dome=1. Global sun/sky intensity and colour remain live multipliers.
; For new profiles sky_yaw is an offset from 28.27; sky_pitch stays 0 for a level horizon.
; Missing profile assets keep original faces and disable mismatched sky ambient.
sky_sets = 1

; ---- level looks: a look of its own for one level (KEEP.md 41) ---------------------------------
; Every key below that starts with a level's name and a dot -- `map06.sun_intensity = 1.2` -- replaces
; that key (here `sun_intensity`) while THAT level is on screen, and only then.  Everywhere else the
; ordinary lines hold, untouched.  Live, like the rest of this file: edit a `map06.` line while you
; play map06 and it takes effect within a second.
; Which level is on screen comes from the forest's own evidence (veg = 1 and veg_levels = 1): a level
; is recognised by its own ground textures, so only a level with a placement file in tod_hd_fx\veg
; can have a look -- today map06 (Virgillo's farm, MM013), mm010 (the jungle) and map08 (the hacienda).
; The level is held while you look at the sky or through a doorway, and let go when another level's
; ground is drawn, the sky set changes (a level load), or 20 s pass with none of its textures.
; A `<level>.` line may set only the look: sun_intensity, sun_colour_r/g/b, sky_intensity,
; sky_colour_r/g/b, ao_influence, specular, shadow_influence, neutralise, colour_keep, exposure,
; contrast, saturation, warmth, tint, lift, gamma, gain, vignette, sky_exposure, sky_tint_r/g/b,
; sky_fog, sky_fog_top, sky_fog_bottom, sky_haze, sky_haze_top, sun_disc_intensity, sun_disc_r/g/b,
; sun_glow, sun_glow_size, sun_glow_r/g/b, shaft_strength, shaft_colour_r/g/b, mist_density,
; mist_colour_r/g/b, dyn_shadow_strength, static_shadow_strength, ssr_env, and the four engine-state
; keys below.  Any other
; key after a level's name is ignored.  Only the `map06.` keys listed here survive a reinstall (the
; installer keeps your values for keys this file ships, and drops keys it does not know).
level_looks = 0        ; 1 = on.  0 = OFF: no `<level>.` line is read and the picture is the previous
                       ; release's, byte for byte
; The ENGINE-STATE keys a look needs.  They change what the game hands the device -- light 0 and its
; linear fog -- so every draw agrees (ours and the ones left to the game).  At these values nothing is
; changed.  Usually set per level (map06. below), but they work as plain keys too.
sun_pitch = 0          ; degrees added to light 0's elevation, its bearing kept (-30..30; negative =
                       ; lower).  The level's baked shadows keep pointing the right way; only their
                       ; length disagrees a little
fog_start_scale = 1.0  ; x the level's fog start (0.25..8): larger = clear air further out
fog_end_scale = 1.0    ; x the level's fog end (0.25..1).  Never above 1: the level's far plane IS its
                       ; fog end, so a longer fog would show the terrain being cut off
fog_colour_r = 1.0     ; x the level's fog colour (0..2), which is also the colour the sky dome's
fog_colour_g = 1.0     ; horizon fades to
fog_colour_b = 1.0
;
; map06: warm golden late afternoon (references: low warm sun, readable shadows, tan ground, a hazy
; warm sky).  Why it was cold: the afternoon sky set's ambient (sky\afternoon\sh.txt) is a clear BLUE
; sky -- an upward face gets 0.70 / 1.02 / 1.60 -- and at sun 0.55 / sky 0.42 it outweighs the sun on
; the ground, so the tan desert rendered grey-blue.  Here the sky's light is turned warm-neutral, the
; sun is warmer and 8 degrees lower (27 -> 19, same bearing), the dome is tinted and hazed,
; the fog starts four times further out and is a paler, greyer tan instead of yellow.
map06.sun_intensity = 0.68   ; kept low so white stucco stays under white in the frame; the grade lifts it
map06.sun_colour_r = 1.00    ; golden, not orange
map06.sun_colour_g = 0.90
map06.sun_colour_b = 0.74
map06.sun_pitch = -8         ; lower, longer light
map06.sky_intensity = 0.40   ; enough fill that the shadowed sides stay readable
map06.sky_colour_r = 1.55    ; x the blue panorama's own light: warm brown-grey shade, not blue
map06.sky_colour_g = 1.00
map06.sky_colour_b = 0.58
map06.sky_exposure = 1.05    ; the dome itself: a touch brighter ...
map06.sky_tint_r = 1.08      ; ... warmer ...
map06.sky_tint_g = 1.00
map06.sky_tint_b = 0.86
map06.sky_haze = 0.50        ; ... and hazier: the fog colour carried up to 30 degrees
map06.sky_haze_top = 30
map06.sun_glow = 0.45        ; a wider halo round the low sun
map06.fog_start_scale = 4.0  ; 60 m -> 240 m: clear air across the valley, still fogged at the far plane
map06.fog_colour_r = 0.80    ; the level's yellow fog (255, 229, 168) -> a pale dusty tan (204, 192, 165)
map06.fog_colour_g = 0.84
map06.fog_colour_b = 0.98
map06.exposure = 0.50          ; the brightness comes back here, where the tone curve's
                             ; shoulder rolls highlights off instead of clipping them
map06.contrast = 1.10
map06.saturation = 1.00
map06.warmth = 0.00          ; the light is already warm; the grade adds none
map06.gamma = 1.10           ; mid-tones up, highlights and blacks held

; ---- high-resolution texture substitution ---------------------------------------------------
; Phase 1 replaces only albedo textures listed in tod_hd_fx\tex\manifest.txt.  The game still
; creates and uploads its original texture; the proxy substitutes a managed DDS only when bound,
; and GetTexture continues to return the original game object.
tex_override = 0       ; 1 = enable the installed high-resolution albedo payload; 0 = exact pass-through
tex_budget_mb = 96     ; maximum managed-memory payload resident on one D3D device
tex_pool = 0           ; WHERE THE OVERRIDE PIXELS LIVE.  0 = D3DPOOL_MANAGED, which keeps a copy in this
;                        32-bit process's own address space -- so the budget competes with the game, the
;                        archives and every other payload, and a few hundred MB is the practical ceiling.
;                        1 = D3DPOOL_DEFAULT: the pixels live in VIDEO memory instead (this machine has
;                        20 GB), filled through a transient SYSTEMMEM staging texture and UpdateTexture,
;                        so tex_budget_mb can be raised into the gigabytes.  The cost is that DEFAULT
;                        resources do not survive a device Reset: TxBeforeReset releases them and they
;                        reload lazily, one per frame, exactly like the depth texture and the atmosphere
;                        targets.  0 is the previous release, byte for byte.
tex_budget_vram = 0    ; 1 = with tex_pool = 1, tex_budget_mb may really go past 512 MiB (up to 3072).
;                        Until now the DLL clamped it to 512 whatever this file said (an 8000 read as
;                        512), and on map06 every on-screen set then stopped one mip short: a 4096
;                        texture showed as 2048, its 2048 normal/ORM as 1024 (the 2026-09-25 log).
;                        Normal maps then load as their DXT5nm file (ATI2 would cost its whole size in
;                        this 32-bit process's address space even in VRAM; DXT5 costs none).
;                        The replacement buildings' textures stay MANAGED and keep their own 512.
;                        Ignored (OFF) with tex_pool = 0.  0 is the previous release, byte for byte.
tex_mip_bias = 0      ; skip this many top override mips (0..4) when memory is tight
tex_pbr = 0            ; 1 = normal + ORM maps on registered relit draws; 0 = Phase-1 shader bytecode
tex_pbr_normal = 1.0   ; 0..2 tangent-normal strength; 0 keeps the geometry normal
tex_pbr_ao = 1.0       ; 0..1 texture occlusion multiplied with HBAO (with a black-crush floor)
tex_debug = 0          ; diagnostics in todhd_fx.log
; Residency (2026-09-22, KEEP.md 25).  An override stays loaded until the budget runs short; only then
; does the texture unused longest (and unused for at least 2 s) go.  A texture queued for loading that
; has not been drawn for 2 s is taken off the queue instead of being loaded off screen.  On-screen
; textures load before anything else.  tex_budget_mb is read as 16..512.  Normal maps load as ATI2 when
; the GPU has it (they fell back to DXT5nm on every machine before 2026-09-22).  The game's log is
; todhd_fx.log in the TODHD_LOG_DIR folder.

; Registered building geometry and PBR materials (live).
; 0 preserves native buildings. 1 requires installed replacement bundles.
; Shares tex_budget_mb with texture overrides; detail streams within that limit.
replacement_models = 0

; Camera-demand quality for registered native roads; requires tex_override = 1.
; Keeps complete albedo/normal/ORM sets within the shared texture budget.
; Nearby surfaces request finer mips; pressure may keep them below full resolution.
; Live switching retains original GetTexture identity; 0 uses the ordinary loader.
tex_streaming = 0

; ---- override streaming after a level load (KEEP.md 33, map06fix) ----------------------------
; A map06 test log: on the level switch 120 override files loaded ONE per frame, so the rocks and
; cliffs near the end of the queue showed the game's own texture for 1.7 s and then popped.  These
; three work with tex_streaming = 1; each 0 is the release before it.  All live.
tex_stream_ms = 0      ; 0..16 ms.  >0 = keep loading overrides in the same frame while this frame's
                       ; loads have taken under this long and the next is predicted to fit (from the
                       ; measured disk+upload rate).  The first load of a frame always goes, as before,
                       ; so no frame costs more than it did.  4 is a good value at 60 fps.
tex_stream_first_mip = 0 ; 0..3.  A texture set that is ON SCREEN with nothing loaded yet, and whose full
                       ; load is over 1 MiB, first loads this many mips down (2 = a 4096 as 1024) and is
                       ; refined in a later frame -- the override shows at once, then sharpens.
tex_hold_frames = 0    ; 0 = a texture counts as on screen for 2 frames after the game last drew it.
                       ; 3..120 = that many.  60 stops a texture queued in the first frames of a level
                       ; from loading at 1/8 size (the 256x256 gp_ter_* loads) and a rock you turn away
                       ; from for a moment from being dropped and re-read.
; ---- keep what is loaded (KEEP.md 50, popfix) -------------------------------------------------
; The game draws a road piece whether it is in front of the camera or behind it, and a piece behind
; it asks for its smallest copy, so every turn of the camera dropped the roads to 1/8 size and read
; them from disk again at full size when they came back (road_017_color: 334 times in 22 minutes, a
; visible sharpness pop each time).  With this on, a texture is never made smaller while the budget
; has room.  Only when something on screen does not fit do textures give way -- the one off screen
; the longest first, and never one loaded or used in the last tex_keep_seconds.  Needs tex_streaming = 1.
tex_hysteresis = 0     ; 0 = OFF: the release before it, byte for byte.  1 = on.  Live.
tex_keep_seconds = 10  ; 1..120 s: a texture used or loaded this recently is never given back
;
; MEMORY HEADROOM (envfix, KEEP.md 54).  TOD is a 32-bit process: at 3.0-3.1 GB of overrides in the city the game's
; OWN resources (the ground) could no longer be made and did not draw.  tex_budget_mb only counts the overrides; these
; two keys also watch what is LEFT, read every 30 frames, and give override rows back (the one idle longest first,
; tex_keep_seconds ignored while short) until the reading is back over its floor.  128 MB clear of the floor again,
; the budget returns step by step.  The log's "summary memory:" line (always written) shows both readings, the
; override bytes, and how many of the GAME's own texture/buffer/surface creates failed; each failure is also logged.
tex_headroom_mb = 0    ; 0 = OFF (the release before it).  64..2048: keep at least this much of the driver's reported
;                        texture memory free for the game.  Live.
tex_va_floor_mb = 0    ; 0 = OFF.  32..1024: keep the largest free block of the process's address space at least this
;                        big (the game's big buffers need ONE free block, not free memory in total).  Live.

; ---- clear coat: a lacquer over the car paint (KEEP.md 36) -----------------------------------
; A modern car's paint is a coloured base under a clear varnish, and the varnish is what shows the sky
; and a tight sun glint.  With this on, every draw whose material class is `car_paint` (the class map's
; own verdict: the vehicle bodies) gets a second, sharp highlight and the sky's reflection from the
; sharp HDRI (the local reflections' rebuild when those are on), both along the smooth geometry and
; weighted by the lacquer's own Fresnel -- strong at grazing angles, faint head-on -- and the paint
; below loses the share the coat reflected.  Needs lighting_mode 1 or 2.  All live.
clearcoat = 0          ; 1 = on.  0 = the release before it, byte for byte (no shader is even made)
clearcoat_strength = 1.0 ; 0..2: x the coat's Fresnel (how glossy the lacquer is overall)
clearcoat_roughness = 0.10 ; 0.04..0.4: the sun glint's width (lower = a smaller, hotter spark)
clearcoat_env = 1.0    ; 0..3: x the sky the coat reflects (0 = the glint alone)
clearcoat_f0 = 0.04    ; 0.02..0.10: the lacquer's reflectance head-on (0.04 is real clear coat)
clearcoat_peak = 4.0   ; 0.5..16: caps the glint's brightness (a sub-pixel spike crawls on low poly)

; ---- full-detail vehicle parts (KEEP.md 37) ------------------------------------------------------
; The C10 pickup at the download's own mesh detail (47,519 triangles instead of 10,831): each engine part
; is swapped for its full-detail copy (tod_hd_fx\vehicles\c10.vhp) as it is drawn, with the engine's own
; wheel roll and steer, doors, hood and tailgate.  Collision, LOD and the shadow are the engine's.  Live.
vehicle_hd = 0         ; 1 = on.  0 = the release before it, byte for byte

; ---- lookgrade: warmer ambient, a real tone curve, GTAO (KEEP.md 51) -------------------------------
; Three changes from the look study (work\look_study).  Each ships OFF; each OFF value is the release
; before it, byte for byte.  All live, except that tonemap_hdr takes effect when the game next makes
; its scene targets (a level load).
;
; THE AMBIENT.  The sky ambient is 42-72 % of all the light in a frame and it is the HDRI's blue sky, so
; everything reads cool and flat.  With this on it is split into a SKY DOME (from above, desaturated and
; less blue) and a WARM GROUND BOUNCE (from below: the level's sun x a typical ground colour), and the
; whole is rescaled so the ground and walls are exactly as bright as before -- the light gets warmer and
; gets a direction, it does not get brighter.  How strong depends on the level's sky set (below);
; `<level>.ambient_warm_strength` (level looks) sets one level on its own.
ambient_warm = 0       ; 1 = on.  0 = OFF: the lighting uploads the sky's SH exactly as before
ambient_warm_strength = 1.0 ; 0..2, x the sky set's own strength below
ambient_warm_jungle = 0.0   ; the jungle and the night level (the original sky): unchanged by default
ambient_warm_city = 0.60    ; maps 01-04, morning: mostly neutral -- less blue
ambient_warm_midday = 0.50  ; maps 07-08
ambient_warm_afternoon = 1.0 ; maps 06 / 10, the desert and the farm: the warmest
ambient_warm_festival = 0.85 ; the day of the dead, dusk
ambient_warm_overcast = 0.0  ; overcast / rain: unchanged
ambient_ground_r = 0   ; the ground's colour for the bounce, 0..1.  0,0,0 = the sky set's own
ambient_ground_g = 0   ; (dusty tan for the afternoon set, grey for the city)
ambient_ground_b = 0
ambient_sky_desat = 0.45 ; 0..1: how much of the sky dome's colour is taken out
ambient_sky_warm = 0.50  ; 0..1: how much of the blue that is left is taken out
ambient_ground_sun = 0.80 ; 0..1: the share of the ground in sun (what lights the bounce)
ambient_keep_exposure = 1 ; 1 = the ambient keeps its brightness on the ground and walls
;
; THE TONE CURVE.  The grade's own highlight shoulder is replaced by AgX (1) or ACES (2), inside the grade
; (exposure, white balance, contrast, saturation, lift, gain, gamma and vignette stay yours around it).
; With tonemap_hdr the game's full-screen scene targets are made 16-bit float, so the lighting's light
; above white (sunlit stucco, specular, fire) reaches the curve and rolls off instead of being cut flat.
; Cost: about 0.3 ms at 3024x1964 with the 16-bit targets, 0.15 ms without.
tonemap_curve = 0      ; 0 = OFF (the grade's shoulder, `tonemap` above), 1 = AgX, 2 = ACES
tonemap_hdr = 1        ; 1 = 16-bit scene targets while the curve is on (applies at the next level load)
tonemap_exposure = 0.0 ; EV before the curve (per level with `<level>.tonemap_exposure`); ACES has its
                       ; own +0.75 built in so both hold today's brightness at 0
tonemap_white = 2.94   ; AgX: the light level that reaches white (2.94 = AgX's own; higher = softer highlights)
tonemap_saturation = 1.10 ; AgX: 1 = the plain curve, which fades saturated blues towards white;
                          ; 1.10 keeps the sky's blue without deepening blue shade
tonemap_punch = 1.0    ; AgX: 1 = the base look, 1.35 = Blender's "punchy" (darker, more contrast)
;
; GTAO (ao_mode = 2 in the ambient occlusion block above).  Ground-truth ambient occlusion at half
; resolution, denoised and brought back to full resolution along the depth, and applied to the AMBIENT
; light only -- never to the sun, unlike HBAO, which darkens the whole frame.  It also measures how much
; SKY each point can see (a roof, an overhang, a room's ceiling on screen) and shuts the ambient out
; indoors.  The pattern is fixed per pixel: a still camera gives a still picture.
gtao_slices = 3        ; 1..8 directions a pixel
gtao_steps = 6         ; 2..16 steps each way
gtao_radius = 1.20     ; metres
gtao_falloff = 0.615   ; share of the radius over which a sample fades out
gtao_intensity = 1.0   ; the final power: 1 = physical, higher = darker contacts
gtao_albedo = 0.35     ; the multi-bounce fit's typical surface brightness (0 = no multi-bounce)
gtao_influence = 1.0   ; 0..1: how much it dims the ambient (ao_influence's job in modes 0 / 1)
gtao_sky = 0.50        ; 0..1: how much the sky visibility shuts the ambient out indoors
gtao_sky_radius = 6.0  ; metres searched for a ceiling or an overhang
gtao_sky_steps = 3     ; 0..8 (0 = no sky visibility)
gtao_max_radius = 64   ; half-res pixels AT 800 WIDE (scaled to your width): the contact search's cap
gtao_blur = 1.0        ; 0..2: the denoise's tap spacing
gtao_denoise = 2       ; 0..3 rounds of the depth-aware denoise
gtao_upsample = 1      ; 1 = the depth-aware full-resolution upsample; 0 = half resolution, bilinear
