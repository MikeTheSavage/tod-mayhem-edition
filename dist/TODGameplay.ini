; TODGameplay.ini - options of TODGameplay.dll for the GOG Total Overdose (put it next to TOD.exe).
; A missing file, a missing key or 0 means OFF: with every feature off the DLL writes nothing to the game's memory.
; Key names: DirectInput names (SPACE, LSHIFT, F10, Q, NUMPAD0 ...), MOUSE1..MOUSE5, PAD_A/B/X/Y/LB/RB/LS/RS/START/BACK/UP/DOWN/LEFT/RIGHT
; (XInput pad 1), NONE. Log: TODGameplay.log next to TOD.exe.

[general]
log = 1

[bullettime]
; Manual bullet time through the game's own time controller, with a meter.
enabled = 1
key = MOUSE3              ; middle mouse button / wheel click
key_alt = NONE
pad_button = PAD_RS       ; right stick click
mode = toggle             ; toggle | hold
scale = 0.30              ; world speed in bullet time (the dive uses 0.11..0.14)
ramp_in = 0.25            ; seconds into bullet time
ramp_out = 0.25           ; seconds back to normal
motion_blur = 1           ; the game's slow-motion blur and slow-motion bullet tracers
dive_slowmo_in_bullettime = 0   ; 0: a dive keeps the bullet-time speed; 1: the vanilla dive slow motion stacks on top
meter_seconds = 8         ; a full meter lasts 8 s of real time
meter_min_start = 0.10    ; fill needed to start
regen_per_second = 0.02   ; slow refill (50 s from empty to full) ...
regen_delay = 2.0         ; ... starting 2 s after bullet time ends
refill_per_kill = 0.12    ; +12 % per enemy killed
refill_per_combo_point = 0.0005   ; + per combo action point (a 100-point move = +5 %)
start_full = 1

[slowmo]
dive_auto_slowmo = 1      ; 0: no automatic slow motion on dives
wire_auto_slowmo = 1      ; 0: none on the slide wire either

[timing]
clock_fix = 1             ; slow motion no longer stalls the game's timers at high frame rates
pickup_step_fix = 1       ; dropped weapons/goodies fall at the same speed at any frame rate
fps_limit = 0             ; 0 = off. TOD HD's d3d9.dll and the renderer bridge already cap at 60: use one limiter only

[controls]
mouse_turn_fix = 1        ; frame-rate independent mouse turning, nothing dropped (same sensitivity as vanilla at 60 fps)
mouse_turn_seconds_per_frame = 0.015833
mouse_sensitivity_x = 1.0
mouse_sensitivity_y = 1.0
invert_y = 0              ; 1 flips the vertical mouse (on top of the game's own invert setting)
mouse_y_fps_normalize = 0 ; experimental: vertical mouse independent of the frame rate
diagonal_normalize = 1    ; W+D no longer runs 41 % faster than W

[keys]
; game key or action = physical key. Actions: run, run_backwards, strafe_left, strafe_right, jump, crouch, shootdodge,
; use, reload, use_powerup, rewind, powerup_left, powerup_right, powerup_menu, vehicle_brake, vehicle_siren,
; vehicle_exit_stunt_prepare, vehicle_exit_stunt. A moved key loses its old function unless it is bound too.
; jump = SPACE
; shootdodge = LSHIFT

[camera]
fov = 0                   ; 0 = vanilla (64). 30..120: the game's 64 becomes this (zooms keep their ratio)
fov_all_cameras = 0       ; 1: cut-scene cameras too
cull_fix = 0              ; 1: culling frustum uses the real aspect (leave 0 with the renderer bridge, it has its own)

[vehicles]
; experimental, they apply to every car that takes these code paths (AI cars too)
steering_return_rate = 0  ; 0 = vanilla (wheels snap straight). 0.25 = back to straight over 4 steps (0.16 s)
s_brake_parity = 0        ; 1: S brakes as hard as V while rolling forward

[restart]
; Hold the key: the mission ends as failed through the game's own path and the result screen offers the retry.
enabled = 1
key = F10
hold_seconds = 1.0

[loader]
load = 1                  ; dsound.dll proxy: 0 = forward to the system dsound.dll only
; chain_dsound = dsoal_dsound.dll

[suave]
; The Suave loco move on power-up slot 11 (Tequila). Off by default. Docs: suave\README.md, checklist
; suave\TEST_IN_GAME.md. Needs the data option suave (names, icon, music) and suave_anims (the clips) in
; todgameplay_data.zip; without them the move still runs with no clips / no music (logged).
enabled = 0
slot = 11                 ; 11 = Tequila (the move's home); 10 = replace the Pinata for an in-game test (data level on_slot10)
cheat_key = NONE          ; e.g. F7: +1 charge of that slot through the game's own grant (goodie 17, or 16 for slot 10; max 2)
log_verbose = 0           ; 1: every action and a state line every 0.5 s in TODGameplay.log
; selection
grab_radius = 5           ; partner = the nearest hostile within this (m)
pull_radius = 15          ; ring = hostiles within this (m), nearest first
ring_max = 8
ring_radius = 3           ; ring slots around Ram (m)
max_height = 3            ; ignore characters more than this above / below Ram
; timeline (beats of the song, 124.17 BPM; c = 0 at the freeze end = music start = intro frame 0)
bpm = 124.17
freeze_seconds = 0.6      ; REAL seconds of the activation freeze (push-in)
freeze_scale = 0.05
intro_beats = 6           ; suave_intro / suave_grabbed
gather_lead_beats = 2     ; the ring starts walking this many beats before the intro ends
gather_beats = 4          ; walk-in time; late members are placed on their slot
orbit_beats = 4           ; high orbiting shot after the intro
cut_beats = 4             ; dance cuts on bar lines
ring_phase_beats = 1      ; circle clip offset per member (one sway per beat: neighbours sway opposite)
dance_beats = 24
dance_cycles = 1
release_beat = 19         ; push on this beat of the last cycle (clip frame 230)
attach_seconds = 0.4      ; the dynamite goes from Ram's hand to the partner's (push frame 10)
dynamite_show = 0.8       ; Ram shows the lit dynamite in his hand this long before the push
push_seconds = 2.2        ; push / stumble length; the partner's look-down starts at its end
closeup_seconds = 1.1     ; plant close-up, then the low front angle
dive_at_seconds = 1.4     ; Ram released this long after the push starts
ending_scale = 0.3        ; slow motion from the front angle (0 = only the dive's own)
; the dive and the explosion (after the takeoff; the earlier of real / game time wins)
auto_dive = 1             ; 1 = the game's forward shoot dodge is triggered; 0 = the player dives (camera handed back)
dive_key_forward = W      ; the keys injected for the automatic dive (the game's defaults)
dive_key_dodge = SPACE
turn_seconds = 1.0        ; real s to turn Ram away from the partner by the game's own yaw (mouse turn / turn_speed) before the keys
turn_tolerance_deg = 15   ; turned when his facing is this close; else the key by his actual facing (S back, A / D side)
dive_clear = 0.6          ; anyone closer to Ram at the takeoff: collision off until he is 1.5 m away
partner_clear = 1.5       ; the partner's root moves this far behind Ram at the takeoff (on the cut; his root overlapping Ram sank every dive)
dive_step = 0             ; Ram's own step off the shared spot (0 = none; the partner moves instead)
ram_ground_snap = 0.35    ; Ram put back on the takeoff floor if he sinks this far below it during the dive (0 = off)
space_probe = 1           ; rays around Ram at the start (smaller ring in a tight space) and before the dive (the most open side)
camera_clamp = 1          ; camera eyes kept out of walls (pulled in, or mirrored to the open side)
dive_state = 36           ; Ram's MoveState while diving (0x24 forward / side dive); dive_state2 = -1 for a second one
dive_wait = 1.5           ; game s without a takeoff -> the explosion anyway
cut_lookdown_real = 0.3   ; the panic cut (the partner looks down at the bundle) this long after the takeoff (real s / game s, the earlier wins)
cut_lookdown_game = 0.3
panic_min = 1.4           ; real s on screen at least ... and at most; the cut back waits for Ram to be panic_lift m up
panic_max = 2.2
panic_lift = 0.5
panic_ram_speed = 0.3     ; Ram's own animation speed while he is airborne in the panic cut (world slow motion does not slow him); back at the cut back
blast_after = 0.3         ; the explosion this long after the cut back (Ram still in the air)
blast_max_real = 4.5      ; the latest explosion after the takeoff
blast_max_game = 1.5
land_hold = 0.5
after_max = 6
; camera, faces, input
camera = 1                ; scripted shots (0: the gameplay camera stays)
camera_blend_back = 1.0
faces = 1                 ; facial expressions (PlayerAnims/Facials)
face_stay = 4
lock_input = 1            ; keys + mouse buttons held off while Ram dances (Escape and F-keys still work)
rotate = 1                ; turn Ram to the partner / the dive direction, the ring to the centre
face_offset_deg = 44.7    ; SA2: the partner's intro start seen from Ram's (flip the sign if Ram faces the wrong side)
intro_place = 1           ; move Ram so his intro starts on his spot (SA2: his Bip starts at x +0.23, z -0.28 of the node)
intro_x = 0.23
intro_z = -0.28
; boom
dynamite = 1              ; the game's dynamite: lit in Ram's hand, then a bundle strapped to the partner's chest (fuses, the explosion)
dynamite_sticks = 3       ; the bundle (1..4 sticks from the shell pool)
dynamite_out = 0.22       ; in front of his Spine2 (m) ...
dynamite_drop = -0.12     ; ... below it (negative = above) ...
dynamite_gap = 0.07       ; ... and side by side
dynamite_ram_hand = L Hand        ; Ram's hold: the game's grenade hold (slot 3, grip l_hand_default, L Hand)
dynamite_grip = l_hand_default
dynamite_slot = 3
boom_radius = 7           ; m around the partner; covers the 3 m ring
boom_damage = 10000       ; kill pass (owner Ram: combo credit)
boom_impulse = 15
boom_mass = 80
boom_slowmo = 0.5         ; TIME_CTRL do_explosion (0 = none)
shake = 1
; music: one segment per partner type (0 = random); files from suave\audio
music = 1
music_segments = 4
music_soldier = 1
music_civil = 2
music_dea = 3
music_other = 4
music_slot = 110          ; the SoundDict entry borrowed for the move (El Mariachi's), restored afterwards
music_seconds = 17.4
hud_effect = 11           ; HUD_power_up_effects_ctrl start_effect type (0 = none)

[smart_ai]
; Smarter enemies (docs ..\smart_ai\README.md, checklist
; ..\smart_ai\TEST_IN_GAME.md). OFF by default; nothing is patched while enabled = 0. It only changes values the game's
; own enemy brain already has (the behaviour fields of each enemy), so the game's state machine does the acting.
enabled = 0
personality = 1           ; each enemy gets a role at spawn (assault / rifleman / cautious): fight range, back-off,
                          ; shoot-dodge, strafe / crouch / wait mix all differ a little - no more identical twins. Only
                          ; what the enemy's row already has is scaled: no shoot-dodge or back-off is given to a type
                          ; without one (melee, defenders, specials)
reaction_stagger = 1      ; first reaction to Ram delayed 0.2..1.0 s per enemy (not within 8 m; needs the tick)
reaction_min = 0.2
reaction_max = 1.0
assault_share = 0.30      ; share of assault (fight at 7 m, more strafing, dodges) ...
cautious_share = 0.25     ; ... and cautious (13.5 m, crouches more, backs off further); the rest riflemen
jitter = 0.25             ; +/- on each enemy's action times and move weights
shootdodge_bonus = 4      ; percent added over the row's own shoot-dodge weights (assault x2, cautious x0.5); rows
                          ; without shoot-dodge get none
squad = 1                 ; per target at most max_advancing enemies close in; the rest hold and shoot from range
max_advancing = 2
min_squad = 3             ; smaller groups behave as vanilla
token_seconds = 8         ; an advancer that already fights passes its turn on after this
token_cooldown = 4
hold_max_distance = 22    ; farther than this an enemy always closes in (out of its weapon's reach otherwise)
hold_stuck_seconds = 5    ; a holder that gets no shot this long is released to hunt
morale = 1                ; an ally dying within morale_radius frightens the others (Morale "UseDefault" enemies)
morale_radius = 15
fear_per_death = 0.3
fear_last_man = 0.3       ; extra when no engaged ally is left near it
fear_decay_per_second = 0.04
fear_health_bonus = 80    ; CS_HealthLeft + fear x this
fear_flee_chance = 25     ; CS_Change_for + fear x this (percent per morale check); the game then flees (state 23)
boss_health = 1000        ; enemies with this much health or more (bosses, the 1000-hp DEA specials) are left alone
skip_factions = 6, 10, 13 ; factions left alone: 6 civilians, 10 DEA (Ram's side), 13 wrestlers ("-" = none)
tick_seconds = 0.1        ; how often the tick looks at the enemies (real time)
discover_seconds = 1      ; how often it looks for enemies a loaded save restored (the game runs no init for them)
discover_radius = 60
log_spawns = 1            ; one log line per enemy spawn (role and changed values)
log_states = 0            ; 1: one log line per enemy state change (for the in-game checklist)

[gang_wars]
; Rival gangs fight each other when they meet (docs ..\gang_wars\README.md). OFF by default; nothing is touched while
; enabled = 0. No code is patched: a gang member with a rival gang member within range is moved into a faction of its
; own, and the game's own faction table makes the two gangs hostile, so the game's vision, aiming, firing, hit
; reactions and kill counting do the fighting. Mission scripts are not touched: buddies, escorts, allies, bosses, VIP
; placements, mounted gunners and scripted characters are never moved, and every death still counts for the mission.
enabled = 0
range = 25                ; metres: a rival gang member this close starts the fight
hysteresis = 8            ; ... and while one is within range + this the fight goes on
calm_seconds = 8          ; no rival that close for this long: the member gets the game's faction back (hunts Ram again)
idle_seconds = 6          ; at war but not fighting a rival this long (a wall between them): back to the game's faction ...
retry_seconds = 12        ; ... and no new war for this long (so nobody stands next to Ram ignoring him)
wake = 1                  ; a member still idling when its war starts gets the game's own alarm (it goes aggressive)
provoke = 1               ; 1: while two gangs fight they ignore Ram until he shoots one; that one (and the friends it
                          ; knows) turns on him, the game's own provoke rule. 0: Ram stays a target for everybody
spark = 0                 ; 1: a fight only starts when Ram shoots a gang member while a rival is within range (start a
                          ; fight, step back, watch); 0: rivals fight as soon as they meet
spark_radius = 40         ; with spark: members this close to the shot one join the fight
; which gangs hate each other (gang-gang pairs; police, DEA friends and Ram keep the game's own relations)
factions = cartel-virgilio, cartel-elvez, cartel-gangster, virgilio-gangster, elvez-gangster, army-mexpolice, dea-outlaw, dea-border, outlaw-border
; the gangs: name = model numbers (CharacterDict ModelStat rows). Add or replace with group_<name> = numbers.
;   cartel 0,1 (Cezar Morales' men)   virgilio 2,3 (the Virgilio brothers)   elvez 22 (hacienda guards)
;   gangster 27 (street gangs)   army 15 (soldiers)   mexpolice 24   border 5 (border police)   dea 9 (DEA taskforce
;   as enemies)   outlaw 30 (DEA outlaws)
spare_factions = 4, 16, 17, 3   ; factions no shipped character uses (Virgilio, Gang01, Unused02, Unknown): one per gang at war
boss_health = 1000        ; enemies with this much health or more are never moved
tick_seconds = 0.25
scan_radius = 80          ; metres around Ram the tick looks at
log_switches = 1          ; a log line per faction change (who, why, which rival how far)
log_targets = 1           ; a log line whenever a gang member's own target changes (Ram / a rival / nobody)
log_found = 1             ; a log line per enemy found (gang, faction, why it is left alone)
status_seconds = 0        ; > 0: a summary line (and the cost per tick) this often
status_members = 0        ; 1: with the summary, one line per tracked character
; test copy only (recording aids): debug_face_war = 1 turns Ram toward the fight (needs [controls] mouse_turn_fix = 1);
; debug_split = <gang> makes every second member of that gang a rival copy of it (a demonstration aid)

[seamless]
; Walk-border map swaps without a load screen (docs ..\seamless\README.md, checklist ..\seamless\TEST_IN_GAME.md).
; OFF by default; nothing is patched while enabled = 0. When a walk loader (no teleport) swaps the submap, the scripted
; fade-out, the 0.3 s wait, the load screen, the progress bar, the 0.2 s black and the fade-in are skipped: the last frame
; stays on screen during the swap (a short hitch). Missions, taxis, ZAP, cutscenes, deaths and menu loads stay vanilla.
; Pair it with the data option seamless = on (the bridge and the tunnel become walk borders instead of teleports).
enabled = 0
prefetch = 1              ; read the next blocks into the file cache near a loader (TODGameplay_seamless.txt; file reads only)
prefetch_distance = 60    ; metres from a loader volume
prefetch_repeat = 180     ; seconds before the same block is read again
log = 1                   ; one TODGameplay.log line per load decision and per swap (UpdateLoadedBlocks time, trigger-to-play time)

; [debug]: TEST COPY ONLY. Key script, heap tracker, automatic border-swap stress. Leave out of a played game.
; [debug]
; keys_file = TODGameplay_keys.txt   ; wait MS / tap KEY / hold KEY MS / mark TEXT / quit, played into the game's keyboard arrays
; heap_check = 1                     ; track TOD.exe's HeapAlloc/HeapFree/HeapReAlloc; 1 = log + skip bad frees, 2 = log only
; stress_swaps = 30                  ; walk-border swaps between stress_a and stress_b, stress_min..stress_max s apart
; stress_a = Downtown 01
; stress_b = Downtown 02
; stress_min = 1.2
; stress_max = 1.2
; stress_quit = 1                    ; end the process when the stress run (or a key-script quit) is done

[display]
; 16:9 (any wide aspect) for the GOG game (docs ..\display\README.md). OFF by default; nothing is patched while
; enabled = 0. Set configpc.txt fullscreen / screensize (e.g. 1920,1080) as usual; this keeps that size and makes the
; HUD, the menus, subtitles and load screens fit it.
enabled = 0
res_table = auto          ; the SCREEN RESOLUTION list: auto = 1280x720, 1600x900, 1920x1080, 2560x1440 and the 5th entry
                          ; (vanilla 1600x1200) = configpc screensize; or five sizes "1280x720, ..."; off = vanilla 4:3 list
                          ; (the menu still prints the old 4:3 names)
startup_size = config     ; config: the saved resolution option no longer switches the game to it after the first frame
                          ; (configpc screensize stays); saved: vanilla behaviour
wide_hud = 1              ; the HUD uses the whole width: score / ammo / health / radar at the screen edges, aim dot centred
hud_scale = 1.0           ; HUD size (0.8 = 20 % smaller widgets)
border = vanilla          ; corner margin (vanilla 0.05 = 5 %); e.g. 0.03 pushes the HUD further into the corners
menus = 1                 ; menus, subtitles, load screens, front end: 4:3 layout with correct proportions (pillarboxed)
                          ; instead of stretched (text no longer 33 % too wide); mouse clicks follow
bands = stretch           ; full-width bars of the menus / subtitles / cut-scene shutters: stretch | fit
backgrounds = cover       ; full-screen sprites (fades, menu backdrop, load-screen art): cover = fill the screen
                          ; undistorted (12 % cropped top and bottom at 16:9) | stretch (vanilla) | fit
cull_fix = 1              ; culling frustum with the real aspect (no objects popping at the 16:9 edges) = [camera] cull_fix
mode_menu = 1             ; SETTINGS > SCREEN RESOLUTION lists this monitor's real modes: windowed sizes that fit, borderless
                          ; at the monitor's size, exclusive fullscreen sizes; Enter applies one live (the game's own "keep /
                          ; revert in N seconds" question). Kept in Documents\Total Overdose\savegames\TODGameplay_display.txt.
                          ; With it on: borderless / res_table / startup_size below are only the first start's default and
                          ; dpi_aware is on. 0 = the old behaviour (configpc + the Display *.cmd scripts)
write_configpc = 1        ; after a change, configpc.txt (fullscreen = false, screensize) and the registry XRes / YRes get a
                          ; windowed size that fits, so the game WITHOUT this DLL still starts sanely
label_chars = 0           ; row labels longer than this many characters are drawn condensed (0 = what the value box holds)
borderless = 0            ; 1: configpc fullscreen = true runs as a borderless window at the configpc size (no display mode
                          ; change; screensize = the monitor size covers it exactly, e.g. 3024,1964)
fullscreen_any_mode = 1   ; exclusive fullscreen at any size the adapter offers (vanilla: only its 4:3 list, else 640x480)
; dpi_aware = 1           ; sizes in physical pixels (no blur / oversize under Windows scaling such as 150 %); default:
                          ; on with borderless, off otherwise (a windowed 1920x1080 then keeps its scaled size)
log = 1

[pad]
; Native controller support: Xbox-style pads (XInput) and PlayStation pads (DualShock 4 / DualSense
; over USB or Bluetooth) drive the game's own console controls - movement and camera on the sticks, every action,
; vehicles, loco moves, menus, pause. Keyboard and mouse keep working; whichever was used last is in charge.
; On-screen prompts follow the device ([Enter] -> A, "Press [Space]" -> the pad button); rumble from the game's own
; vibration events plus shots, shoot-dodge landings and camera shakes. With enabled = 0 nothing is patched.
; In game: SETTINGS > VIBRATION (ON / OFF) when the data option controller = menu is installed.
enabled = 0
xinput = 1                ; Xbox and XInput-compatible pads (Steam Input, DS4Windows, most PC pads)
playstation_hid = 1       ; DualShock 4 / DualSense read directly (USB and Bluetooth; rumble over USB only)
prompts = auto            ; auto (the device used last) | keyboard | xbox | playstation
                          ; (ini only: no menu row - a new SETTINGS row is a new record in HUD.fragment = saves break)
glyphs = auto             ; pad pictures: auto (the pad's own kind) | xbox | playstation
deadzone_left = 0.20      ; radial dead zones (fraction of a full push)
deadzone_right = 0.15
trigger_threshold = 0.25  ; LT / RT count as pressed above this
look_curve = 2.0          ; right-stick turn / look rate = push ^ look_curve (the game alone: 3, sluggish in the middle)
look_sensitivity_x = 1.0  ; above 1 reaches the game's top turn rate (180 deg/s) with less push
look_sensitivity_y = 1.0
invert_x = 0              ; on top of the game's own HORIZONTAL / VERTICAL AXIS options
invert_y = 0
compensate_game_deadzone = 1   ; the game ignores the first 30 % of each axis: the DLL lifts the stick past it
rumble = 1
rumble_strength = 1.0     ; 0 .. 2 (0 = off; the in-game VIBRATION row also switches it off)
rumble_events = 1         ; extra rumble the game lacks: own shots, shoot-dodge landings, camera shakes (explosions near you)
rumble_shot = 0.25
rumble_landing = 0.55
rumble_shake = 1.0
rumble_log = 1            ; every rumble request and motor change in TODGameplay.log
tell_scripts = 0          ; 1: the game's scripts are told "controller input" while the pad is in charge (console menu help with
                          ; PS2 circle / triangle sprites the DLL does not redraw); 0: PC menu help, its [Enter] / [Esc] become pad buttons
; Pad layout: which pad button feeds each button of the game's console layout (ControlDict XBox setup). Defaults:
; CROSS = A (jump / use / accelerate / menu select), CIRCLE = B (target object / slide / menu back),
; SQUARE = X (head shot / brake-reverse), TRIANGLE = Y (reload / enter vehicle), R1 = RT (shoot), L1 = LT (shoot dodge,
; prepare exit stunt), R2 / L2 = RB / LB (next / previous weapon), L3 = LS (crouch / freeze time), R3 = RS,
; D_UP = use loco move, D_DOWN = rewind, D_LEFT / D_RIGHT = loco move selection, START = pause, SELECT = BACK.
; map_<game button> = <pad button>: A B X Y LB RB LT RT LS RS BACK START UP DOWN LEFT RIGHT (or CROSS CIRCLE SQUARE
; TRIANGLE L1 R1 L2 R2 L3 R3 SHARE OPTIONS), NONE = never. Example: map_R1 = RB
; map_R1 = RT

[pad_bind]
; Per-action pad buttons (the action names of the game's ControlDict), e.g.
; Accelerate = RT
; Decelerate = LT
; shoot = RT

[fixes]
; Engine bug fixes. Installed together with any other feature (with every feature off nothing is patched).
vector_realloc = 1        ; the border-swap crash: the asset loader's array freed a buffer the CRT realloc had already released
                          ; (a double free on every block swap, vanilla too; seamless swaps made the crash frequent). 0 = vanilla
weapon_owner = 1          ; the weapon reload crash (0x869E89): an empty enemy weapon whose owner is gone (dropped, despawned)
                          ; asked that null owner to reload; now it skips the request (vanilla bug). 0 = vanilla

[physics]
; PROTOTYPE: loose props (barrels, crates, bottles, ...) become Box3D rigid bodies. Needs TODPhysics.dll next to
; TOD.exe. Bullets and explosions push them, they tumble and settle on the level's own collision and the game draws them
; where the simulation puts them. Cosmetic only: they do not block bullets, AI, Ram or cars any more than vanilla. Off.
enabled = 0
radius = 40               ; level collision + props within this many metres of Ram (scanned again after rescan_distance)
rescan_distance = 18
max_bodies = 64
step = 0.04               ; fixed physics step (the game's own character / car step), interpolated in between
substeps = 4
bullet_impulse = 25       ; N s per bullet (pellet) that hits a prop
shell_radius = 7          ; grenades, rockets, dynamite
shell_impulse = 450       ; Box3D impulse per area (N s / m^2)
destroy_radius = 6        ; red barrels, gas pumps and other exploding destroyables
destroy_impulse = 350
blast_lift = 4            ; extra upward speed (m/s) at the centre of a blast
density = 40              ; kg / m^3 of a prop's collision volume (hollow props), then clamped to min_mass .. max_mass
min_mass = 3
max_mass = 80
friction = 0.6
restitution = 0.15
; which models are props: case-insensitive parts of the model path, comma separated (no comment on these lines)
props = barrel,crate,box,bottle,can_,cans,bucket,trash,/bins/,rubbish,garbage,chair,stool,bench,cone_traffic,trafficcone,tire,tyre,keg,jar,pot_,vase,basket,sack,cooler,plank,pallet,melon,fruit,cardboard,carton,jerrycan,canister,paint,dustbin,suitcase,cup,glass,plate,bowl,pumpkin,tin_
exclude = building,house,terrain,chunk,road,bridge,_wall,fence,door,gate,window,vehicle,car_,truck,boat,train,station,temple,roof,stair,ladder,lod,_shadow,skybox,sky_,light,lamp,glow,hydrant,telepole,sign,breakableglass
log_seconds = 5           ; cost / body statistics in TODGameplay.log
drive_step = 1            ; the world also steps while Ram drives (the game stops the on-foot tick then: props, wrecks and ragdolls froze)
drive_lead_seconds = 0.8  ; while driving a scan is centred this far ahead of the car (seconds of its speed, at most 0.4 x radius)
; test copy only: debug_kick_key (a blast next to the nearest prop), debug_fire_key (holds the left mouse button),
; debug_dump_key (scan again, logging every model), debug_shots = 1 (screenshot marks for the harness)

[mayhem]
; MAYHEM props: chain reactions and breakable cover on top of [physics] (needs [physics] enabled = 1
; and TODPhysics.dll; without them both stay off). Nothing is written into saves. Off by default.
; Chain reactions: an explosion (grenade, rocket, dynamite, a red barrel / gas tank, a car) sets off the explosive objects
; and the cars around it, each after its own short delay (nearer ones first), through the game's own damage, so the game's
; own explosion, fire, sound and damage follow - and the Box3D blast throws the props and the debris.
chain_reactions = 0
chain_radius = 9          ; m around an explosion
chain_delay_min = 0.15    ; s (game time: slow motion stretches a chain)
chain_delay_max = 0.6
chain_max_per_second = 6  ; detonations started per second at most (a long chain ripples instead of one burst)
chain_max_per_frame = 2
chain_max_depth = 12      ; links of one chain at most
chain_cars = 0            ; 1 = cars in reach take the hit too: they burn, then blow up the game's way. 0 (default): a chained
                          ; car can destroy a mission car or kill a buddy (MISSION FAILED). Never next to a buddy either way
car_blast_radius = 8      ; Box3D blast of an exploding car (props and debris thrown)
car_blast_impulse = 450
blast_debris = 6          ; shards thrown by every exploding barrel / tank (0 = none)
; Breakable cover: crates, tables, stalls, carts, benches, bins ... fall apart under fire. Their health is scaled down
; (bullets and blasts break them sooner), they burst into debris pieces that Box3D throws, and enemies crouched behind
; one stand up when it goes.
breakable_cover = 0
cover_health_scale = 0.35 ; 0.35 = about three times fewer hits to break a cover prop
debris_max = 48           ; pieces alive at once (the oldest go first)
debris_life = 12          ; s a piece stays (it shrinks away at the end)
debris_pieces = 8         ; pieces per broken cover prop
debris_impulse = 1.0      ; how hard the pieces fly
debris_style = 1          ; 1 = small chunks, grit and dust showing the broken prop's own texture; 0 = the old big slats / red shards
debris_size = 1.0         ; x the chunk sizes of style 1 (cover chunks 5..16 cm, blast shards 3..11 cm)
debris_bits = 14          ; grit bits per broken prop (cheap, no physics body; blasts throw 1.3x)
debris_dust = 1           ; a puff of dust in the prop's colour when cover breaks
expose_radius = 2.6       ; m: enemies this close to a broken cover prop stand up
cover_blast_radius = 6    ; m: an explosion also hits the cover props this close
; which destroyables are cover: parts of the model / placeholder name, comma separated (no comment on these lines)
cover_props = crate,box,table,stall,stand,cart,bench,chair,stool,sofa,couch,desk,shelf,cabinet,pallet,barrel,bin,dumpster,kiosk,fruit,melon,basket,sack,cooler,keyboard,monitor,computer,tv,crt
cover_exclude = sign,pole,phone,hydrant,glass,light,lamp,window,door,fence,toilet,bathtub
log_seconds = 5           ; statistics (blasts, detonations, cover, debris, per-frame cost) in TODGameplay.log
; test copy only: debug_survey = 1 (log every destroyable / car near Ram), debug_survey_key, debug_ignite_key (the nearest
; explosive destroyable takes a hit), debug_hit_key (a 10 hp hit on the nearest cover prop), debug_shots = 1

[car_physics]
; Cars in the [physics] Box3D world (physics/CARS.md). Needs [physics] enabled = 1 and the TODPhysics.dll of
; this build. Moving cars shove and scatter the props; grenade / rocket / dynamite / barrel blasts and exploding cars
; throw and spin cars; destroyed cars become Box3D wrecks that tumble, flip and settle. Off by default.
enabled = 0
push_props = 1            ; every car near Ram is a kinematic box that pushes the prop bodies (the car itself is not slowed)
blast_cars = 1            ; blasts throw cars (through the game's own car physics) and an exploding car jumps
wreck_dynamic = 1         ; a destroyed car is handed to Box3D until it settles (never the player's own car while inside)
bullets = 1               ; bullets nudge wrecks
impulse_scale = 1.0       ; one knob for every car push, kick and spin (0.5 = half as wild, 2 = twice)
extra_props = stand,cart,stall,kiosk   ; added to [physics] props: street stands and carts become bodies the cars plough through

[difficulty]
; EASY / NORMAL / HARD / BRUTAL chosen in the game's own SETTINGS menu (dll\HOOKS.md "Difficulty").
; OFF by default: nothing is patched while enabled = 0. Pair with the data option difficulty_menu = on (the BRUTAL text)
; and difficulty = normal (the factors below are applied at run time; a baked level is detected and refused).
; EASY / NORMAL = vanilla. HARD = vanilla Hard + the hard factors. BRUTAL = vanilla Hard + the brutal factors + 50 % more
; enemies. BRUTAL is saved as the game's HARD in Slot11 plus brutal = 1 in TODGameplay_difficulty.txt next to it
; (vanilla and a game without the DLL read Hard).
enabled = 0
menu = 1                  ; BRUTAL as a fourth value of DIFFICULTY LEVEL (needs the data option's text)
tuning = 1                ; damage taken / dealt, enemy spread, burst pauses, reaction times, dropped ammo (hard / brutal)
reinforcements = 1        ; BRUTAL: a dead enemy's placement brings one more enemy from the pool, 1 per 2 deaths
reinforce_share = 0.5     ; extra enemies per enemy death (0.5 = +50 %)
reinforce_share_psycho = 0.375   ; PSYCHO's own share (3 per 8 deaths, a quarter fewer than BRUTAL); the damage stays PSYCHO's
reinforce_min_distance = 18   ; Ram at least this far (m) from the placement, so nobody appears in his face
reinforce_max_distance = 45   ; ... and within the pool's placeholder radius
reinforce_delay = 4       ; seconds after the death
reinforce_keep_slots = 2  ; pool slots (CharacterResourceCtrl MaxAllocated) always left to the mission's own enemies
max_live_enemies = 0      ; BRUTAL / PSYCHO: raise the game's cap of pooled enemies alive at once (vanilla 6 or 8) up to 8
                          ; (the pool has 9 character shells; one always stays free, as in the game); 0 = the game's cap.
                          ; Vanilla levels always keep the game's. A mission with a buddy / escort / friend keeps the game's
; max_live_with_buddies = 0   ; 1 = raise the cap in buddy / escort missions too (they then share every shell with the fight)
mission_log = 1           ; log lines only: mission ends and their result, Ram's deaths, deaths of buddies / escorts / VIPs
; skip_factions = 6, 10, 13, 14   ; never brought back (6 civilians, 10 DEA, 13 wrestlers, 14 police); bosses (1000 hp), buddies, civilians never
; brutal_text = 0         ; Menu text ordinal for BRUTAL when the data option is missing (0 = no BRUTAL in the menu)
; psycho_text = 0         ; the same for PSYCHO (value 5; BRUTAL's tuning and enemy count until its own feature exists)
; force_level = brutal    ; test only: ignore the menu
log_verbose = 0

[mayhem_title]
; MAYHEM burns through the title screen under the TOTAL OVERDOSE logo ("PRESS ENTER TO START"), and into the main
; menu's header band after "TOTAL OVERDOSE". The title shows exactly as vanilla first; then an ember ignites at the
; shotgun's muzzle and a ring of fire eats a hole that hugs the word; MAYHEM comes up in it. Main menu: the same burn
; the first time it appears in a session, already burnt in afterwards. Never in game, loading screens or pause.
; Needs TODGameplay_mayhem.dds, TODGameplay_mayhem_fx.dds (and TODGameplay_mayhem_fire.dds for the fire layer) next to
; the exe and a shader model 3 graphics card. No data change.
; The code's default is 0 (a key missing from an older ini keeps the vanilla title); this sample turns it on.
enabled = 1
main_menu = 1             ; burn it into the main menu's header band too
delay = 0.6               ; seconds of the vanilla title before the ember ignites
reveal_seconds = 2.0      ; ignition -> the whole word burnt in
menu_delay = 0.25         ; the same pause on the main menu
ignite_x = 288            ; where it ignites, in title-art pixels (640 x 512 picture): the right barrel's muzzle
ignite_y = 350
scale = 1.0               ; size of the lettering (1.0 = about 760 px wide at 1080p)
offset_x = 0              ; move it, in title-art pixels (1 art pixel = about 3 screen pixels at 1080p; + = right)
offset_y = 0              ; + = down
menu_scale = 1.0          ; size in the menu band (1.0 = 2.7 x the caption's height)
shimmer = 1.0             ; heat haze over the painted flames (0 = none)
fire = 0.55               ; the looping fire over the flame tips (0 = none)
cracks = 0.6              ; flicker of the glowing cracks (0 = none)
specks = 1.0              ; ember specks in the char while it burns
sparks = 5                ; sparks per second rising from the flames afterwards
perf_log_seconds = 10     ; one cost line in TODGameplay.log every N seconds while it draws (0 = never)

[psycho]
; PSYCHO difficulty: elite enemies use loco moves against Ram (psycho/README.md). Active only while the
; difficulty is PSYCHO (needs [difficulty] enabled = 1 and PSYCHO picked in SETTINGS > DIFFICULTY LEVEL); on any other
; level nothing happens. Nothing global is touched: no slow motion, no camera, no HUD, no power-up meter.
enemy_loco_moves = 0      ; 1 = on (default 0: a missing key keeps PSYCHO = BRUTAL)
moves = tornado, toro     ; tornado = the spin with the enemy's gun firing all round; toro = El Toro's charge
cooldown = 20-40          ; seconds (game time) between two moves of one enemy, random in the range
telegraph_seconds = 1.0   ; wind-up before a move hurts: red power-up flash + orange glow on the enemy, the loco-move sting
elite_only = 1            ; 1 = elites (health >= elite_health) only; 0 = every hostile enemy in a fight
elite_health = 200        ; CMLong 200, Soldier 225; grunts 100-150
bosses = 0                ; 1 = bosses (health >= boss_health) use moves too. 0: bosses are mission actors the mission script
                          ; drives; VIP placements, escorts and scripted enemies never use a move
; boss_health = 1000
; handback_watch_seconds = 30   ; an enemy that used a move is watched this long: a rewind can bring back its AI-off state
                                ; from inside the move, it is handed back to its AI again
; chance = 0.35           ; roll per qualifying enemy per check (every 0.5 s)
; first_delay = 6         ; an enemy must be in the fight this long before its first move
; global_gap = 5          ; seconds after any enemy move before the next (only one enemy move at a time, always)
; interrupt_damage = 0.5  ; damage taken in the wind-up that cancels the move (any hit); the cooldown is then halved
; dive_dodges = 1         ; Ram in a shoot-dodge is not hit
; tornado_min_distance = 2.5, tornado_max_distance = 11, tornado_radius = 12, tornado_damage = 25 (per hit,
;   before the enemy's Damage_mod and the difficulty's damage factor), tornado_hit_interval = 0.35, tornado_fire_speed = 0.4
; toro_min_distance = 5, toro_max_distance = 16, toro_speed = 9, toro_overrun = 3, toro_damage = 60, toro_impulse = 9
; flash_effect = 30       ; ParticleDict ids: 30 PickupPowerups_Trigger_Red; glow_effect = 180 Goodie_Glow_Orange
; sound = -1              ; SoundDict id of a sting at the telegraph; -1 = none (default). Ram's own voice lines (106-109,
                          ; e.g. 107 Loco_Move_Serious) are refused: an enemy never speaks with Ram's voice
elite_drops = 1           ; 1 = a killed elite leaves its ability (its one fixed move) as a real pickup: one charge of that loco move
drop_seconds = 30         ; how long a drop stays. Ram walks over it; a full slot (2) leaves it lying. One drop per placement per
                          ; mission (a re-armed reinforcement drops nothing again), none in a cut-scene, a rewind takes it back
; drop_max = 3            ; drops on the ground at once (the pool has 5 goodie props for the whole level)
; drop_track_radius = 45, drop_settle_seconds = 1.5, drop_body_reach = 3, drop_body_drop = 1.5, drop_give_up_seconds = 15,
;   drop_steal_distance = 20 (a level goodie this far from Ram gives its prop to a drop when the pool is empty), drop_lift = 0.75
;   (m above the floor, as the level's goodies float; the floor is the highest point under a 0.25 m footprint)
log_verbose = 0

[minimap]
; The round radar (bottom left) becomes a minimap and the mission objectives get markers, in the original HUD's look.
; The map is drawn from YOUR game files by hud\tools\bake_minimap.py (the installer runs it; it writes
; TODGameplay_minimap\ next to TOD.exe). Without that folder the radar stays a radar and the markers still work.
; Enemy / ally dots and the mission blips are the game's own. With enabled = 0 nothing is patched.
enabled = 0
rotate = 1                ; 1 = the map turns with the view like the game's blips; 0 = north up (the radar's pointer shows the view)
zoom = 0.75               ; 1 = the game's own 50 m to the rim; 0.75 = 67 m; 2 = 25 m (the blips follow; 0.25 .. 4)
map = 1                   ; draw the baked map inside the radar
map_opacity = 0.9         ; ink strength of the map on the radar's parchment (0 .. 1)
objective_marker = 1      ; an arrow outside the radar's rim toward an objective that is beyond its range
world_marker = 1          ; a diamond with the distance over each objective in the world (an arrow at the screen edge when off screen)
world_markers_max = 3     ; at most this many (the mission's waypoint first, then the nearest)
marker_scale = 1.0        ; size of the world markers (0.5 .. 2.5)
; map_dir = TODGameplay_minimap   ; where the baked maps are (next to TOD.exe)
perf_log_seconds = 30     ; one cost line in TODGameplay.log every N seconds (0 = never)

[mayhem_heat]
; The mayhem meter: chaos Ram causes (kills, cop and civilian kills, his explosions, broken props, cars, loco moves,
; stylish combo kills) builds heat in five levels. The game's own radar shows it: clean = vanilla, building heat = a
; warm orange tint, top heat = red with the rim pulsing red / dark; chili peppers next to the radar catch fire one by one.
; When Ram has caused nothing for calm_seconds the heat cools one level every decay_seconds.
; Higher heat sends more enemies: reinforcements in waves (dead enemy placements of the area come back, from rooftops
; and balconies first at level 3+), through the [difficulty] reinforcement engine with all of its mission-safety rules
; (works with [difficulty] off too; scaled by the difficulty: easy 0.4, normal 0.7, hard 0.85, brutal 1, psycho 1.25).
; The code's default is 0 (an older ini stays vanilla); this sample turns it on.
enabled = 1
decay_seconds = 10        ; cooling: seconds per level once Ram is out of the fight
calm_seconds = 7          ; seconds without chaos before the cooling starts
max_level = 5             ; 1..5 levels (and chilis)
tint = 1.0                ; radar tint strength (0 = no tint)
icons = 1                 ; the heat chilis next to the radar (slot k burns with flame size k)
pulse = 1                 ; the red / dark rim pulse at the top level
icon_scale = 1.0          ; size of the chilis (1.0 = 64 px squares at 1080p)
escalation = 1            ; more enemies with more heat (0 = the meter only)
escalation_scale = 1.0    ; 0 = none, 1 = the table, 2 = twice the waves (x the difficulty factor)
heat_gain = 1.0           ; all heat points x this
others_weight = 0.5       ; destruction someone else caused counts x this
near_cooling = 0.3        ; cooling speed while hostiles are still within near_radius (he is hiding, not gone)
near_radius = 30
rooftop_height = 3.0      ; level 3+: placements at least this far above Ram come back first
score_multiplier = 1      ; heat multiplies the score Ram earns, on top of the game's own combo multiplier (0 = off)
score_top = 2.0           ; the multiplier at the top level: no heat and level 1 = x1, then linear (x1.25 / 1.5 / 1.75 / 2)
score_label = 0           ; 1 = an x1.25 .. x2 label by the chilis (off by default; the multiplier stays)
log = 1
log_verbose = 0
perf_log_seconds = 10     ; one HUD cost line every N seconds while it draws (0 = never)

[ragdoll]
; Active ragdolls (docs ragdoll\README.md): a hit knocks the hit body part and the character staggers,
; pulled back into its animation by powered joints; on death the muscles fade, the body goes limp, tumbles and is
; thrown by explosions. Needs TODPhysics.dll (the [physics] module's Box3D world; [physics] enabled = 0 is fine: it
; then builds only the level collision). Off.
enabled = 0
death_ragdoll = 1         ; limp ragdoll on death (instead of the death clip)
active_hits = 1           ; powered stagger on hits that do not kill
max_ragdolls = 6          ; simulated at once; a new death freezes the oldest limp one
max_frozen = 16           ; settled corpses whose pose is kept
settle_seconds = 6        ; a limp body is frozen after this at the latest
corpse_seconds = 4        ; the dead body stays this long before the game swaps in its death-pose corpse (vanilla 0.5);
                          ; its pooled character is held that long (fewer free enemies for that time)
impulse_scale = 1.0       ; every push on a ragdoll: bullets, blasts, the game's hit impulse (2 = twice as dramatic)
joint_stiffness = 18      ; powered joints (Hz): lower = floppier staggers
recover_seconds = 0.7     ; a hit body part back to full strength
; how a shot reads: a firm flinch on a live enemy, a heavy fall on a death (explosions are not affected by these)
hit_impulse = 60          ; N s one bullet gives a live body (was 110: the upper body whipped like an inflatable tube man)
hit_max_dv = 4            ; m/s at most for the part that was hit (arm, head); the rest of the push goes to the torso
active_friction = 4       ; joint friction while staggering: higher = no sway back past the pose (0 = the old wobble)
spine_limit_scale = 0.7   ; spine / chest / neck bend limits (1 = the old, looser ones)
death_max_dv = 4          ; m/s at most for one part from the killing bullet (no limb whip as the body drops)
stall_seconds = 0.3       ; the world steps only while Ram is on foot: no physics step for this long (he drives) = no new
                          ; ragdoll, the running ones go back to the game's own animation / death clip until it steps again
stall_fall_seconds = 0.8  ; ... a corpse that had fallen this long keeps the pose it lies in instead
debug_draw = 0           ; test copy: capsules + camera into the log (ragdoll\tools\rd_overlay.py draws them)

[bigger_fights]
; EXPERIMENTAL, goes with the data option bigger_fights (it BREAKS old saves: start a new game). More enemies at the start
; of a fight on BRUTAL / PSYCHO, enemy vehicles with gunmen at heat 3+. With this on the game saves to BFSlot00.. and
; leaves Slot00.. alone; old saves are not offered and come back when this is off. Docs: docs/mods/bigger_fights.md
enabled = 0
separate_saves = 1        ; 0 = the game's own Slot00.. names (old saves would be offered to data they do not fit)
extra_enemies = 1         ; wake the dormant extra placements of the mission blocks
heat_vehicles = 1         ; heat 3+: vehicles with gunmen ([mayhem_heat] on)
cap_scale_brutal = 1.5    ; live enemies: the game's cap (6, free roam 8) x this
cap_scale_psycho = 1.3    ; PSYCHO: missions 8, free roam 10 (1.85 = 11 / 13 felt overwhelming); BRUTAL 9 / 12
psycho_wake_share = 0.6   ; PSYCHO: this share of the extra enemies wakes (evenly spread over each tier); BRUTAL wakes all of its own
wake_radius = 90          ; m from Ram: an extra enemy wakes when its original is this close
join_radius = 30          ; m from Ram: an extra enemy with a body is told to fight him
heat_vehicles_in_missions = 1 ; vehicles also in missions (never with buddies or an escort); 0 = free roam only
vehicles_heat3 = 1        ; vehicles out at once per heat level
vehicles_heat4 = 2
vehicles_heat5 = 3
vehicle_every_seconds = 30 ; at most one new vehicle per this many seconds
vehicle_stop_min = 12     ; m from Ram: where a vehicle's road route ends
vehicle_stop_max = 34
vehicle_stop_far = 110    ; ... or the nearest road this close when he is off the roads
vehicle_drive_in = 80     ; m of road the vehicle drives in on
vehicle_seconds = 150     ; a vehicle's squad is given up after this long
log = 1

[drops]
; Enemies drop more than in the original game, on every difficulty (docs/mods/drops.md). A killed enemy still drops its gun;
; the gun carries more ammo, and the kill may also leave health or a power-up: the game's own goodies (its models, glow,
; pickup, sound and HUD), on the floor beside the body. Health and power-ups otherwise come only from the level's placed
; goodies and combo awards.
enabled = 0
ammo_scale = 1.75         ; dropped guns carry this x the vanilla ammo. It REPLACES the difficulty's ammo factor (HARD x0.75,
                          ; BRUTAL / PSYCHO x0.5): with this on, every level gets this much
keep_difficulty_ammo = 0  ; 1 = multiply by the difficulty's factor as well (PSYCHO then gets 1.75 x 0.5)
health_chance = 0.2       ; per kill: a health goodie
health_hurt_bonus = 0.3   ; ... + this x the share of Ram's health that is missing (nearly dead: 0.2 + 0.3 = 0.5)
large_health_share = 0.25 ; of the health drops, this share is a large one (the rest medium)
powerup_chance = 0.05     ; per kill: a power-up whose slot is not full (a locked or full slot never comes)
; the power-up weights (0 = never): rewind, golden gun, tornado, El Toro, sombrero, wrestler, mariachi, pinata
weight_rewind = 3
weight_golden_gun = 1
weight_tornado = 2
weight_toro = 2
weight_sombrero = 1
weight_wrestler = 1
weight_mariachi = 1
weight_pinata = 2         ; never while Suave takes the Pinata's slot ([suave] slot = 10)
elite_skip_powerup = 1    ; a PSYCHO elite that leaves its loco move ([psycho] elite_drops) gets no power-up from here
drop_seconds = 30         ; how long a pickup stays (the game's own timer); none in a cut-scene, a rewind takes it back
max_on_ground = 3         ; pickups of this feature at once. The level has 5 goodie props for everything: when none is
                          ; free, a level goodie at least steal_distance m from Ram lends its prop and gets it back later
; steal_distance = 25, track_radius = 45, settle_seconds = 1.5, body_reach = 3, body_drop = 1.5, give_up_seconds = 10,
;   gun_gap = 0.7 (m from the body, toward Ram: the gun lies on the body)
; lift = 0.75, footprint = 0.25, max_step = 0.35: the pickup floats lift m above the highest floor under it (centre and
;   four points footprint m around it, a point more than max_step higher is a wall): the level's own goodies float
;   0.64-0.89 m above theirs
; write_bulletdrop = 1    ; with [difficulty] tuning off this feature writes the ammo bands itself
log_verbose = 0

[debug]
; The hang watchdog: when the picture stops for hang_seconds (the game thread stuck: a freeze with the sound going on),
; TODGameplay.log gets the stuck code's addresses and TODGameplay_hang_<date>_<time>.dmp (a few MB) is written next to
; it. Send both files. Costs nothing per frame (a counter); a minimised window, alt-tab or a load is not a hang.
hang_watchdog = 1
; hang_seconds = 5, hang_load_seconds = 60, hang_max_dumps = 3
